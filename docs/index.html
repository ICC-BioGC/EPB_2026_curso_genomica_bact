<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Montagem de genomas</title>
<style>
:root{--g:#037972;--y:#f8e04d;--gr:#ebebeb;--tx:#222}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#fff;color:var(--tx);font-family:"Verdana Pro",Verdana,"DejaVu Sans",sans-serif;display:flex;flex-direction:column}
header{background:var(--g);color:#fff;padding:10px 18px 0;flex:none}
header .t{font-size:15px;font-weight:700;letter-spacing:.01em}
header .s{font-size:11px;opacity:.85;margin:2px 0 8px}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}
nav button{font:inherit;font-size:12.5px;color:#fff;background:transparent;border:0;border-bottom:4px solid transparent;padding:8px 12px;cursor:pointer;white-space:nowrap;opacity:.85}
nav button:hover{opacity:1}
nav button.on{opacity:1;border-bottom-color:var(--y);font-weight:700}
nav button i{font-style:normal;font-size:10.5px;background:rgba(255,255,255,.2);border-radius:9px;padding:1px 6px;margin-right:6px}
main{flex:1;min-height:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
iframe.on{display:block}
footer{flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 14px;border-top:1px solid var(--gr);font-size:12px;background:#fff}
footer button{font:inherit;font-size:12px;border:1.5px solid var(--g);color:var(--g);background:#fff;border-radius:7px;padding:5px 12px;cursor:pointer}
footer button:disabled{opacity:.35;cursor:default}
</style></head><body>

<script>
const M=[{"t": "Do DNA às reads", "h": "<!doctype html>\n<html lang=\"pt-BR\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Do DNA às reads<\/title>\n<style>\n:root{--g:#037972;--y:#f8e04d;--gr:#ebebeb;--tx:#222;--pu:#6b5bb5;--or:#c58a1c;--rd:#d6452f}\n*{box-sizing:border-box}\nbody{margin:0;background:#fff;color:var(--tx);font-family:\"Verdana Pro\",Verdana,\"DejaVu Sans\",sans-serif;font-size:14px}\n.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 40px}\n.eyebrow{font:11px ui-monospace,Menlo,monospace;letter-spacing:.12em;color:#555;text-transform:uppercase}\nh1{margin:6px 0 6px;font-size:26px;color:var(--g)}\np.lead{margin:0 0 14px;max-width:800px;line-height:1.5;color:#444}\n.steps{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}\n.steps button{font:inherit;font-size:12px;padding:7px 11px;border:1.5px solid var(--g);background:#fff;color:var(--g);border-radius:8px;cursor:pointer}\n.steps button i{font-style:normal;font-weight:700;margin-right:5px}\n.steps button.on{background:var(--g);color:#fff}\n.steps button.done{background:#e3f1ef}\n.card{border:1.5px solid var(--gr);border-radius:12px;padding:12px 14px;background:#fff;margin-bottom:14px}\n.card h3{margin:0 0 8px;font-size:14px;color:var(--g)}\nsvg{display:block;width:100%;height:auto}\nsvg text{font-family:ui-monospace,Menlo,monospace}\n.ctl{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:13px}\n.ctl label{display:flex;align-items:center;gap:6px}\n.ctl button,.sb{font:inherit;font-size:12px;padding:6px 11px;border:1.5px solid var(--g);background:#fff;color:var(--g);border-radius:8px;cursor:pointer}\n.ctl button.on,.sb.on{background:var(--g);color:#fff}\ninput[type=range]{accent-color:var(--g);width:190px}\nselect{font:inherit;font-size:12px;padding:4px 6px;border:1.5px solid var(--g);border-radius:6px;color:var(--g);background:#fff}\n.explain{border:1.5px dashed var(--g);background:#f4f9f8;border-r . Esquemas simplificados e ilustrativos; os números dependem do kit e do equipamento.<\/div>\n<\/div>\n<script>\nconst NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id);\nfunction el(t,a,x){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(x!==undefined)e.textContent=x;return e}\nfunction rng(s){return()=>(s=(s*1664525+1013904223)>>>0)/4294967296}\nconst C={g:'#037972',gl:'#9fcfca',y:'#f8e04d',pu:'#6b5bb5',or:'#c58a1c',rd:'#d6452f',gr:'#ebebeb',dk:'#222',A:'#2e9e5b',Cc:'#2b6cb0',G:'#e0b100',T:'#d6452f'};\nconst S={s1:{lysed:false,harsh:false},s2:{m:400},s3:{ins:400,lo:300,hi:500,pcr:8},s4:{sub:1},s5:{cyc:6,sel:0},s6:{rl:150,ins:400},s7:{p:30},s8:{pairs:1,rl:150,gm:5.3,cp:4},s9:{rl:3}};\nconst NAMES=['Extração','Fragmentação','Biblioteca','Flow cell','Síntese (SBS)','Paired-end','FASTQ','Cobertura','Nanopore'];\nlet cur=0;\nfunction ctl(h){$('ct').innerHTML=h}\nfunction kp(arr){$('kp').innerHTML=arr.map(([l,v,hi])=>`<div class=\"k ${hi?'hi':''}\"><small>${l}<\/small><b>${v}<\/b><\/div>`).join('')}\nfunction sl(id,lab,min,max,val,step,fmt){return `<label>${lab} <input type=\"range\" id=\"${id}\" min=\"${min}\" max=\"${max}\" value=\"${val}\" step=\"${step||1}\"> <b id=\"${id}v\">${fmt?fmt(val):val}<\/b><\/label>`}\nfunction bind(id,obj,key,fn,fmt){const e=$(id);e.oninput=()=>{obj[key]=+e.value;$(id+'v').textContent=fmt?fmt(+e.value):e.value;fn()}}\nconst fm=n=>n.toLocaleString('pt-BR');\n// ---------- 1 extração ----------\nfunction r1(){const s=S.s1,g=$('sc');\n const cells=[[60,70],[220,70],[140,190]];\n cells.forEach(([x,y],i)=>{g.appendChild(el('rect',{x,y,width:130,height:90,rx:40,fill:s.lysed?'#fff':'#f4f9f8',stroke:s.lysed?'#bbb':C.g,'stroke-width':2,'stroke-dasharray':s.lysed?'5 4':'',opacity:s.lysed?.5:1}));\n  if(!s.lysed){g.appendChild(el('circle',{cx:x+55,cy:y+45,r:26,fill:'none',stroke:C.g,'stroke-width':3}));g.appendChild(el('circle',{cx:x+98,cy:y+34,r:10,fill:'none',stroke:C.or,'stroke-width':3}));g.appendChild(el('circle',{cx:x+100,cy:y+62,r:6,fill:'none',stroke:C.rd,'stroke-width':3}))}});\n g.appendChild(el('text',{x:60,y:50,'font-size':12,fill:'#555'},'células (cada uma com cromossomo e plasmídeos)'));\n g.appendChild(el('text',{x:60,y:310,'font-size':11,fill:'#777'},'verde: cromossomo · laranja: plasmídeo A · vermelho: plasmídeo B'));\n g.appendChild(el('path',{d:'M440 160 L500 160',stroke:'#222','stroke-width':2,'marker-end':'url(#ar)'}));\n g.appendChild(el('text',{x:470,y:148,'text-anchor':'middle','font-size':11,fill:'#555'},s.lysed?'lise + purificação':'lisar →'));\n g.appendChild(el('rect',{x:540,y:50,width:400,height:240,rx:14,fill:'#fff',stroke:'#222','stroke-width':2}));\n g.appendChild(el('text',{x:740,y:44,'text-anchor':'middle','font-size':12,fill:'#555'},'tubo com DNA'));\n const r=rng(9);\n if(!s.lysed)g.appendChild(el('text',{x:740,y:170,'text-anchor':'middle','font-size':13,fill:'#999'},'(nada no tubo: células ainda inteiras)'));\n else if(!s.harsh){for(let i=0;i<4;i++){let d=`M560 ${85+i*36}`;for(let x=0;x<360;x+=30)d+=` q15 ${(r()-.5)*24} 30 0`;g.appendChild(el('path',{d,fill:'none',stroke:C.g,'stroke-width':2.4}))}\n  [[600,265,9],[690,262,6],[790,268,5]].forEach(([x,y,rr],i)=>g.appendChild(el('circle',{cx:x,cy:y,r:rr,fill:'none',stroke:i?C.rd:C.or,'stroke-width':2.5})));\n  g.appendChild(el('text',{x:740,y:76,'text-anchor':'middle','font-size':11,fill:C.g},'DNA de alto peso molecular (moléculas muito longas)'))}\n else{for(let i=0;i<90;i++){const x=560+r()*360,y=90+r()*160,l=8+r()*28,a=r()*Math.PI;g.appendChild(el('line',{x1:x,y1:y,x2:x+Math.cos(a)*l,y2:y+Math.sin(a)*l,stroke:C.g,'stroke-width':2}))}\n  g.appendChild(el('text',{x:740,y:76,'text-anchor':'middle','font-size':11,fill:C.rd},'DNA já quebrado em pedaços curtos pelo próprio manuseio'))}\n ctl(`<button class=\"${s.lysed?'on':''}\" id=\"b1\">${s.lysed?'↺ reiniciar':'▶ lisar as células'}<\/button><label>método:<\/label><button class=\"${!s.harsh?'on':''}\" id=\"m1\">suave (pipetagem lenta)<\/button><button class=\"${s.harsh?'on':''}\" id=\"m2\">agressivo (vórtex forte)<\/button>`);\n $('b1').onclick=()=>{s.lysed=!s.lysed;draw()};$('m1').onclick=()=>{s.harsh=false;draw()};$('m2').onclick=()=>{s.harsh=true;draw()};\n kp([['tamanho típico das moléculas',!s.lysed?'—':s.harsh?'centenas de pb a poucos kb':'dezenas a centenas de kb',s.lysed],['uso mais indicado',!s.lysed?'—':s.harsh?'Illumina (vai fragmentar de qualquer jeito)':'reads longas (Nanopore)',false]])}\n// ---------- 2 fragmentação ----------\nfunction draw2hist(g,m,x0,y0,w,h,lo,hi){const r=rng(31),N=3000,L=[];for(let i=0;i<N;i++)L.push(Math.max(40,-m*Math.log(Math.max(r(),1e-6))));\n const bins=[];let e=Math.log2(50);const E=[];for(let b=0;b<=22;b++)E.push(Math.pow(2,e+b*.4));\n const cnt=new Array(22).fill(0);L.forEach(v=>{for(let b=0;b<22;b++)if(v>=E[b]&&v<E[b+1]){cnt[b]++;break}});\n const mx=Math.max(...cnt),bw=w/22;\n cnt.forEach((c,b)=>{const hh=c/mx*h,mid=(E[b]+E[b+1])/2,keep=lo===undefined||(mid>=lo&&mid<=hi);g.appendChild(el('rect',{x:x0+b*bw+1,y:y0+h-hh,width:bw-2,height:hh,fill:keep?C.g:'#ccc'}))});\n [100,300,1000,3000].forEach(t=>{const b=Math.log2(t/50)/.4;g.appendChild(el('text',{x:x0+b*bw,y:y0+h+14,'text-anchor':'middle','font-size':10,fill:'#555'},t>=1000?t/1000+' kb':t+' nt'))});\n const kept=L.filter(v=>lo===undefined||(v>=lo&&v<=hi)).length/N;return kept}\nfunction r2(){const g=$('sc'),m=S.s2.m;\n g.appendChild(el('text',{x:40,y:24,'font-size':12,fill:'#555'},'janela de 3.000 nt do genoma · cada corte é aleatório'));\n const r=rng(5),W=920,x0=40,y=44,win=3000;let pos=0,i=0;const cuts=[];while(pos<win){pos+=-m*Math.log(Math.max(r(),1e-6));if(pos<win)cuts.push(pos)}\n const b=[0,...cuts,win];\n for(let k=0;k<b.length-1;k++){const xa=x0+b[k]/win*W,xb=x0+b[k+1]/win*W;g.appendChild(el('rect',{x:xa+.5,y,width:Math.max(xb-xa-1,1),height:26,fill:k%2?C.g:'#4a9e98'}));\n  if(xb-xa>40)g.appendChild(el('text',{x:(xa+xb)/2,y:y+17,'text-anchor':'middle','font-size':10,fill:'#fff'},Math.round(b[k+1]-b[k])));\n  if(k>0){g.appendChild(el('path',{d:`M${xa} ${y+34} l-5 8 l10 0 z`,fill:C.pu}))}}\n g.appendChild(el('text',{x:40,y:y+58,'font-size':11,fill:C.pu},'▲ pontas dos fragmentos: é aqui que as reads vão começar (as pontas caem em lugares irregulares)'));\n g.appendChild(el('text',{x:40,y:150,'font-size':12,fill:'#555'},'distribuição dos tamanhos dos fragmentos (3.000 fragmentos simulados)'));\n draw2hist(g,m,40,160,920,120);\n ctl(sl('m2s','tamanho médio do fragmento:',150,1500,m,50,v=>v+' nt'));bind('m2s',S.s2,'m',draw,v=>v+' nt');\n kp([['fragmentos num genoma de 5,3 Mb',fm(Math.round(5.3e6/m)),true],['nº de cortes na janela',cuts.length,false],['método','sonicação (física) ou tagmentação (enzimática)',false]])}\n// ---------- 3 biblioteca ----------\nfunction r3(){const g=$('sc'),s=S.s3;\n g.appendChild(el('text',{x:40,y:22,'font-size':12,fill:'#555'},'molécula da biblioteca: adaptadores + DNA do genoma (inserto)'));\n const ins=Math.max(60,s.ins/800*460),blocks=[['P5',44,C.g],['i5',26,C.y],['Rd1',44,C.pu]],x0=60;let x=x0;\n const draw=(lab,w,col,txt)=>{g.appendChild(el('rect',{x,y:40,width:w,height:34,fill:col,stroke:'#fff'}));g.appendChild(el('text',{x:x+w/2,y:62,'text-anchor':'middle','font-size':11,fill:col===C.y?'#222':'#fff'},lab));x+=w};\n blocks.forEach(([l,w,c])=>draw(l,w,c));\n g.appendChild(el('rect',{x,y:40,width:ins,height:34,fill:'#ebebeb',stroke:'#999'}));g.appendChild(el('text',{x:x+ins/2,y:62,'text-anchor':'middle','font-size':12,fill:'#222'},'inserto ≈ '+s.ins+' nt'));x+=ins;\n [['Rd2',44,C.pu],['i7',26,C.y],['P7',44,C.g]].forEach(([l,w,c])=>draw(l,w,c));\n g.appendChild(el('text',{x:60,y:96,'font-size':10,fill:'#555'},'P5/P7: ancoram na flow cell · i5/i7: índices (barcode da amostra) · Rd1/Rd2: onde se ligam os primers de sequenciamento'));\n g.appendChild(el('text',{x:40,y:130,'font-size':12,fill:'#555'},'seleção de tamanho: só os fragmentos dentro da janela seguem'));\n const kept=draw2hist(g,450,40,140,520,110,s.lo,s.hi);\ g'));\n g.appendChild(el('text',{x:50,y:190,'font-size':12,fill:C.pu,'font-weight':700},'Nanopore: uma read longa do tamanho que o DNA extraído permitir'));\n const a=Math.max(0,4.5-L/2),b=Math.min(12,a+L);g.appendChild(el('rect',{x:x0+a*sc,y:202,width:(b-a)*sc,height:12,fill:C.pu,opacity:.9}));\n const spans=a<=3&&b>=9;g.appendChild(el('text',{x:50,y:238,'font-size':12,fill:spans?C.g:C.rd,'font-weight':700},spans?'✓ a read cobre flanco único, IS, gene, IS e flanco único: o contig fecha':'✗ a read ainda não cobre os dois flancos únicos: a IS não é atravessada'));\n // squiggle\n const r=rng(3);let d='M50 290';for(let i=0;i<70;i++)d+=` L${50+i*6} ${275+Math.round(r()*30)}`;\n g.appendChild(el('path',{d,fill:'none',stroke:C.pu,'stroke-width':1.3,opacity:.6}));g.appendChild(el('text',{x:430,y:314,'font-size':10,fill:'#777'},'sinal elétrico (ilustrativo): a corrente muda conforme as bases passam pelo poro'));\n ctl(sl('l9','tamanho da read longa:',1,12,L,0.5,v=>v+' kb'));bind('l9',S.s9,'rl',draw,v=>(+v).toFixed(1)+' kb');\n kp([['read longa',L.toFixed(1)+' kb',true],['atravessa a IS?',spans?'sim':'não',false]]);\n const t=document.createElement('div');t.innerHTML='<table><tr><th><\/th><th>Illumina<\/th><th>Nanopore<\/th><\/tr><tr><td>comprimento<\/td><td>75–300 nt<\/td><td>do que o DNA extraído permitir (centenas de pb a &gt; 100 kb)<\/td><\/tr><tr><td>amplificação<\/td><td>sim (clusters)<\/td><td>não: lê a molécula individual<\/td><\/tr><tr><td>extração<\/td><td>aceita DNA fragmentado<\/td><td>exige DNA longo e íntegro (extração suave)<\/td><\/tr><tr><td>no assembly<\/td><td>muitos contigs; repetições quebram<\/td><td>atravessa repetições; fecha replicons<\/td><\/tr><\/table>';$('ct').appendChild(t)}\n// ---------- notas ----------\nconst EX=[\n ['<b>O ponto de partida é uma suspensão de células.<\/b> Cada célula tem 1 cromossomo e, quando há, plasmídeos. A lise libera o DNA e a purificação o separa de proteínas e RNA. Moléculas longas são frágeis: pipetagem forte ou vórtex as quebra. Para Illumina isso não importa (o DNA será fragmentado de qualquer forma); para reads longas, é decisivo.','<b>Para a montagem:<\/b> a qualidade da extração define o <i>teto<\/i> do que se pode montar. Plasmídeos grandes também são mais frágeis ao cisalhamento, um possível motivo de cobertura menor ou contigs de plasmídeo fragmentados.'],\n ['<b>O DNA é cortado em pedaços de tamanho controlado:<\/b> por sonicação (ondas de ultrassom) ou por <b>tagmentação<\/b>, em que uma transposase corta e já cola os adaptadores. Os cortes são aleatórios: alguns pedaços saem curtos, outros longos, e as pontas caem em lugares irregulares.','<b>Para a montagem:<\/b> essa aleatoriedade é a origem da <b>cobertura irregular<\/b>. Onde caem poucas pontas, poucas reads começam; é por isso que o gráfico de cobertura da aba k-mers não é uma linha reta.'],\n ['<b>Biblioteca:<\/b> cada fragmento ganha adaptadores nas duas pontas. Eles têm (1) as sequências P5/P7 que prendem na flow cell, (2) os <b>índices<\/b> que identificam a amostra (assim se misturam várias amostras na mesma corrida) e (3) os sítios onde os primers de sequenciamento se ligam. Em seguida há <b>seleção de tamanho<\/b> e, geralmente, <b>PCR<\/b>.','<b>Para a montagem:<\/b> a janela de seleção define o <b>inserto<\/b>, o mesmo da aba paired-end: ele decide se um par consegue atravessar uma repetição. Cada ciclo de PCR dobra as moléculas, e mais ciclos significam mais <b>duplicatas<\/b> e viés; por isso existem kits sem PCR.'],\n ['<b>Flow cell:<\/b> uma lâmina com milhões de oligos. Cada molécula da biblioteca hibridiza em um oligo, é copiada, se curva e prende no oligo vizinho (ponte); isso se repete até formar um <b>cluster<\/b> de milhares de cópias idênticas no mesmo ponto.','<b>Para a montagem:<\/b> um cluster vem de uma molécula só: é a origem de <b>1 read<\/b>. A amplificação existe para o sinal de 1 molécula ficar visível.'],\n ['<b>Sequenciamento por síntese:<\/b> a cada ciclo entram quatro nucleotídeos marcados com cores diferentes e com um <b>terminador reversível<\/b>, então só uma base entra por vez. A câmera fotografa, a cor revela qual base entrou, o terminador e o corante são removidos e o ciclo seguinte começa. <b>O nº de ciclos é o comprimento da read.<\/b>','<b>Para a montagem:<\/b> tudo acontece em paralelo para milhões de clusters, por isso a Illumina gera tantas reads curtas. Com o passar dos ciclos os clusters ficam fora de sincronia, e é isso que baixa a qualidade no fim da read (etapa 7).'],\n ['<b>Paired-end:<\/b> depois de ler R1, a fita é invertida (nova ponte) e o equipamento lê R2 pela outra ponta do mesmo fragmento. Resultado: duas reads separadas por uma distância conhecida (o inserto). Se o inserto for menor que 2× a read, R1 e R2 se sobrepõem.','<b>Para a montagem:<\/b> é a informação que o SPAdes usa para resolver repetições e fazer scaffolds. O que importa é se o par consegue <b>ancorar em sequência única<\/b> dos dois lados da repetição.'],\n ['<b>FASTQ:<\/b> cada read vira 4 linhas: nome, bases, separador e <b>qualidade<\/b>. A qualidade Phred é Q = −10·log10(P erro): Q30 significa 1 erro em 1.000 bases. Cada caractere da linha 4 é o Q de uma base (somado a 33 para ser imprimível).','<b>Para a montagem:<\/b> a qualidade cai no fim da read, e é aí que nascem os erros que viram <b>tips<\/b> no grafo (aba k-mers). Por isso se faz trimming (fastp, Trimmomatic) antes de montar.'],\n ['<b>Cobertura (Lander & Waterman):<\/b> com N reads de comprimento L e genoma de tamanho G, a cobertura média é c = N·L/G. Como as pontas caem ao acaso, o nº de reads por posição segue aproximadamente uma distribuição de Poisson, e a fração sem nenhuma read é cerca de e<sup>−c<\/sup>.','<b>Para a montagem:<\/b> pouca cobertura deixa buracos que viram contigs separados. O plasmídeo, com várias cópias por célula, tem cobertura proporcionalmente maior que o cromossomo, e isso é uma pista que usamos para classificar contigs.'],\n ['<b>E se a read for longa?<\/b> No Nanopore a molécula inteira passa por um poro e a variação de corrente identifica as bases, sem amplificar. O comprimento da read vem do DNA extraído, e pode ser de dezenas de kb.','<b>Para a montagem:<\/b> uma read mais longa que a repetição (IS) <b>atravessa<\/b> a repetição e liga as duas regiões únicas: é o que fecha cromossomo e plasmídeos. Esse é o argumento para sequenciamento híbrido nos isolados de importância clínica.']];\nconst TT=['1 · Extração do DNA','2 · Fragmentação','3 · Construção da biblioteca','4 · Flow cell: clusters','5 · Sequenciamento por síntese','6 · Paired-end: R1 e R2','7 · O arquivo FASTQ','8 · Quanto sequenciar? Cobertura','9 · E o Nanopore?'];\nconst R=[r1,r2,r3,r4,r5,r6,r7,r8,r9];\nconst K=[0,1,2,3,4,6];\nfunction draw(){const g=$('sc');g.innerHTML='';const ix=K[cur];\n g.appendChild(el('defs',{})).innerHTML='<marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerUnits=\"userSpaceOnUse\" markerWidth=\"10\" markerHeight=\"10\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"#222\"/><\/marker>';\n $('ttl').textContent=(cur+1)+' · '+TT[ix].split(' · ')[1];R[ix]();$('ex').innerHTML=EX[ix][0];$('pm').innerHTML=EX[ix][1];\n const st=$('st');st.innerHTML='';K.forEach((j,i)=>{const b=document.createElement('button');b.className=i===cur?'on':(i<cur?'done':'');b.innerHTML='<i>'+(i+1)+'<\/i>'+NAMES[j];b.onclick=()=>{cur=i;draw()};st.appendChild(b)});\n $('pv').disabled=cur===0;$('nx').disabled=cur===K.length-1}\n$('pv').onclick=()=>{cur=Math.max(0,cur-1);draw()};$('nx').onclick=()=>{cur=Math.min(K.length-1,cur+1);draw()};\ndraw();\n<\/script><\/body><\/html>\n"}, {"t": "fastp", "h": "<!doctype html>\n<html lang=\"pt-BR\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>fastp: antes e depois<\/title>\n<style>\n:root{--g:#037972;--y:#f8e04d;--gr:#ebebeb;--tx:#222;--pu:#6b5bb5;--rd:#d6452f}\n*{box-sizing:border-box}\nbody{margin:0;background:#fff;color:var(--tx);font-family:\"Verdana Pro\",Verdana,\"DejaVu Sans\",sans-serif;font-size:14px}\n.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 40px}\n.eyebrow{font:11px ui-monospace,Menlo,monospace;letter-spacing:.12em;color:#555;text-transform:uppercase}\nh1{margin:6px 0 6px;font-size:26px;color:var(--g)}\np.lead{margin:0 0 14px;max-width:820px;line-height:1.5;color:#444}\n.card{border:1.5px solid var(--gr);border-radius:12px;padding:12px 14px;background:#fff;margin-bottom:14px}\n.card h3{margin:0 0 8px;font-size:14px;color:var(--g)}\n.cmd{background:#1f2a29;color:#e8f3f1;border-radius:10px;padding:12px 14px;font:12.5px/2 ui-monospace,Menlo,monospace;overflow-x:auto}\n.cmd .c{color:#7fb8b2}\n.cmd button{font:inherit;color:var(--y);background:transparent;border:1px solid rgba(248,224,77,.6);border-radius:5px;padding:1px 6px;cursor:pointer;white-space:nowrap}\n.cmd button.on{background:var(--y);color:#222}\n.cmd .fx{color:#9fd0cb}\n.explain{border:1.5px dashed var(--g);background:#f4f9f8;border-radius:10px;padding:10px 12px;line-height:1.55;margin-bottom:12px}\n.explain b{color:var(--g)}\n.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin:0 0 10px;color:#444}\n.lg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}\n.blk{margin-bottom:14px}\n.blk .t{font:700 11px ui-monospace,Menlo,monospace;letter-spacing:.1em;color:#555;margin-bottom:6px}\n.row{display:flex;align-items:flex-end;gap:10px;margin-bottom:8px}\n.nm{width:34px;font:700 13px ui-monospace,Menlo,monospace;color:var(--g);padding-bottom:20px}\n.rd{display:flex;gap:2px;min-height:62px;align-items:flex-end;flex-wrap:nowrap;overflow-x:auto}\n.c1{width:25px;flex:none;text-align:center}\n.c1 .l{height:22px;line-height:22px;font:600 13px ui-monospace,Menlo,monospace;color:#fff;border-radius:4px}\n.c1 .b{width:100%;margin-top:2px;border-radius:2px}\n.c1.rm .l{outline:2px dashed #222;outline-offset:-2px}\n.sz{font:12px ui-monospace,Menlo,monospace;color:#555;padding-bottom:20px;white-space:nowrap;margin-left:6px}\n.gone{height:62px;display:flex;align-items:center;color:#b3261e;font-weight:700;font-size:13px}\n.arrow{text-align:center;color:var(--g);font-size:13px;margin:2px 0 10px}\n.pm{border:1.5px solid var(--y);background:#fffbe0;border-radius:10px;padding:10px 12px;line-height:1.55}\n.pm b{color:#7a6600}\n<\/style><\/head><body><div class=\"wrap\">\n<div class=\"eyebrow\">2 · Controle de qualidade<\/div>\n<h1>fastp: antes e depois de cada flag<\/h1>\n<p class=\"lead\">Cada par de reads tem um <b>R1<\/b> e um <b>R2<\/b>. Clique em uma flag do comando para ver um par de exemplo <b>antes<\/b> e <b>depois<\/b> dela. As reads aqui têm só 30 bases para caber na tela (as reais têm 100 a 300).<\/p>\n<div class=\"card\"><h3>1 · O comando: clique em uma flag amarela<\/h3>\n<div class=\"cmd\" id=\"cmd\"><\/div><\/div>\n<div class=\"card\"><h3 id=\"tt\"><\/h3>\n<div class=\"explain\" id=\"ex\"><\/div>\n<div class=\"lg\"><span><i style=\"background:#037972\"><\/i>base do genoma<\/span><span><i style=\"background:#6b5bb5\"><\/i>adaptador<\/span><span><i style=\"background:#c9a800\"><\/i>poly-G<\/span><span><i style=\"background:#d6452f\"><\/i>base com qualidade &lt; Q20<\/span><span>barra embaixo = qualidade (mais alta, melhor)<\/span><\/div>\n<div class=\"blk\"><div class=\"t\">ANTES<\/div><div id=\"bf\"><\/div><\/div>\n<div class=\"arrow\" id=\"ar\"><\/div>\n<div class=\"blk\"><div class=\"t\">DEPOIS<\/div><div id=\"af\"><\/div><\/div>\n<\/div>\n<div class=\"pm\"><b>Por que limpar antes de montar?<\/b> Cada base errada cria k-mers que não existem no genoma: viram ramos falsos no grafo e consomem memória. Em um teste, <span style=\"font-family:ui-monospace,Menlo,monospace\">--cut_right<\/span> reduziu os 21-mers distintos de 102 M para 26 M. O relatório <span style=\"font-family:ui-monospace,Menlo,monospace\">--html<\/span> mostra o antes e o depois.<\/div>\n<\/div>\n<script>\nconst $=id=>document.getElementById(id);\nconst W=4,QT=20,LREQ=20,UP=30,AD='AGATCGGAAGAGCGTCGTGT';\nfunction rng(s){return()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296}}\nfunction mk(seed,n,qf,spec){const r=rng(seed),B='ACGT',a=[];\n for(let i=0;i<n;i++){a.push({b:B[Math.floor(r()*4)],q:Math.max(3,Math.min(40,Math.round(qf(i,r)))),k:'ok'})}\n return a}\nconst good=(i,r)=>35+(r()-.5)*4;\nfunction CASES(){\n // cada caso devolve {r1,r2}\n const ad=n=>{const a=mk(7,30,good);for(let i=n;i<30;i++){a[i].b=AD[i-n];a[i].k='ad'}return a};\n const c={};\n c.ad={r1:ad(22),r2:ad(22)};\n c.pg={r1:(()=>{const a=mk(11,30,good);for(let i=24;i<30;i++){a[i].b='G';a[i].k='pg';a[i].q=37}return a})(),r2:mk(12,30,good)};\n c.cf={r1:mk(13,30,(i,r)=>i<3?3+r()*2:good(i,r)),r2:mk(14,30,good)};\n c.cr={r1:mk(15,30,(i,r)=>i<21?good(i,r):Math.max(5,34-(i-20)*3.2+r()*3)),r2:mk(16,30,(i,r)=>i<15?good(i,r):Math.max(5,34-(i-14)*2.6+r()*3))};\n c.q={r1:mk(17,30,good),r2:mk(18,30,(i,r)=>[2,5,7,9,12,15,18,21,24,26,28].includes(i)?8+r()*9:good(i,r))};\n c.len={r1:mk(19,12,good),r2:mk(20,30,good)};\n return c}\nconst FL=[\n {k:'ad',f:'--detect_adapter_for_pe',t:'Adaptador',d:'<b>--detect_adapter_for_pe<\/b> acha e corta o adaptador. Quando o fragmento é <b>mais curto que a read<\/b>, o sequenciador passa do fim do DNA e lê o adaptador. O fastp compara R1 e R2 (que leem o mesmo fragmento por pontas opostas) para descobrir onde o fragmento termina.'},\n {k:'pg',f:'--trim_poly_g',t:'Cauda poly-G',d:'<b>--trim_poly_g<\/b> remove a cauda de G. Em equipamentos de duas cores (NovaSeq), \"sem sinal\" é lido como <b>G com qualidade alta<\/b>. Por isso o filtro de qualidade sozinho não pegaria.'},\n {k:'cf',f:'--cut_front',t:'Corte do começo (5\\')',d:'<b>--cut_front<\/b> desliza uma janela de 4 bases a partir do <b>início<\/b> da read e remove bases enquanto a média da janela estiver abaixo de Q20. Para na primeira janela boa, então pode sobrar uma base ruim colada nela.'},\n {k:'cr',f:'--cut_right --cut_right_mean_quality 20',t:'Corte do final (3\\')',d:'<b>--cut_right<\/b> desliza a janela do início para o fim. Na primeira janela com média abaixo de Q20, <b>corta essa janela e tudo à direita<\/b>. É o que tira a ponta ruim típica do fim da read, e costuma ser pior em R2.'},\n {k:'q',f:'--qualified_quality_phred 20 --unqualified_percent_limit 30',t:'Filtro de qualidade da read',d:'<b>Base com Q ≥ 20 é \"boa\".<\/b> Se mais de <b>30%<\/b> das bases da read estiverem abaixo disso, a read é descartada. E se uma das duas reads do par cai, o <b>par inteiro<\/b> cai.'},\n {k:'len',f:'--length_required 50',t:'Comprimento mínimo',d:'<b>--length_required<\/b> descarta a read que ficou curta demais depois dos cortes. No comando real o mínimo é 50 pb; aqui usamos 20 só porque as reads de exemplo têm 30.'}];\nlet sel='ad';\nfunction mean(a,i){let s=0;for(let j=i;j<i+W;j++)s+=a[j].q;return s/W}\n// retorna {keep:[bool], pairDrop:null|msg}\nfunction apply(k,r1,r2){\n const out=[r1,r2].map(r=>r.map(()=>true));\n if(k==='ad')[r1,r2].forEach((r,x)=>r.forEach((c,i)=>{if(c.k==='ad')out[x][i]=false}));\n if(k==='pg')[r1,r2].forEach((r,x)=>r.forEach((c,i)=>{if(c.k==='pg')out[x][i]=false}));\n if(k==='cf')[r1,r2].forEach((r,x)=>{let s=0;while(s+W<=r.length&&mean(r,s)<QT){out[x][s]=false;s++}});\n if(k==='cr')[r1,r2].forEach((r,x)=>{for(let j=0;j+W<=r.length;j++){if(mean(r,j)<QT){for(let i=j;i<r.length;i++)out[x][i]=false;break}}});\n let drop=null;\n if(k==='q'){[r1,r2].forEach((r,x)=>{const bad=r.filter(c=>c.q<QT).length,p=100*bad/r.length;if(p>UP&&!drop)drop=`R${x+1}: ${bad} de ${r.length} bases (${p.toFixed(0)}%) abaixo de Q${QT}; limite ${UP}%`})}\n if(k==='len'){[r1,r2].forEach((r,x)=>{if(r.length<LREQ&&!drop)drop=`R${x+1} tem ${r.length} pb; mínimo ${LREQ}`})}\n return{out,drop}\n}\nfunction colr(c){if(c.k==='ad')return'#6b5bb5';if(c.k==='pg')return'#c9a800';return c.q<QT?'#d6452f':'#037972'}\nfunction row(n,r,keepArr,mode){\n const kept=r.filter((c,i)=>keepArr[i]).length;\n const cells=r.map((c,i)=>{\n  if(mode==='after'&&!keepArr[i])return'';\n  const rm=mode==='before'&&!keepArr[i];\n  return`<div class=\"c1 ${rm?'rm':''}\" title=\"Q${c.q}\"><div class=\"l\" style=\"background:${colr(c)}\">${c.b}<\/div><div class=\"b\" style=\"height:${Math.round(c.q/40*30)}px;background:${colr(c)};opacity:.5\"><\/div><\/div>`}).join('');\n return cells\n}\nfunction draw(){\n const C=CASES()[sel],f=FL.find(x=>x.k===sel);\n $('cmd').innerHTML=`<span class=\"c\">conda activate fastp<\/span><br>fastp <span class=\"fx\">-i reads_1.fastq.gz -I reads_2.fastq.gz -o limpo_1.fq.gz -O limpo_2.fq.gz --thread 4<\/span><br>&nbsp;&nbsp;`+\n  FL.map(x=>`<button class=\"${x.k===sel?'on':''}\" data-k=\"${x.k}\">${x.f}<\/button>`).join(' ')+`<br>&nbsp;&nbsp;<span class=\"fx\">--json amostra.fastp.json --html amostra.fastp.html<\/span>`;\n $('tt').textContent='2 · '+f.t;$('ex').innerHTML=f.d;\n const {out,drop}=apply(sel,C.r1,C.r2);\n const mkRow=(n,r,keep,mode)=>{\n  const kept=keep.filter(Boolean).length;\n  let body=mode==='after'&&drop?`<div class=\"gone\">✕ descartada<\/div>`:`<div class=\"rd\">${row(n,r,keep,mode)}<\/div>`;\n  const sz=mode==='before'?r.length+' pb':(drop?'0 pb':kept+' pb');\n  return`<div class=\"row\"><div class=\"nm\">${n}<\/div>${body}<div class=\"sz\">${sz}<\/div><\/div>`};\n $('bf').innerHTML=mkRow('R1',C.r1,out[0],'before')+mkRow('R2',C.r2,out[1],'before');\n $('af').innerHTML=mkRow('R1',C.r1,out[0],'after')+mkRow('R2',C.r2,out[1],'after');\n $('ar').innerHTML=drop?`▼ par descartado: ${drop}`:'▼ '+f.f.split(' ')[0];\n}\n$('cmd').onclick=e=>{const b=e.target.closest('button');if(b){sel=b.dataset.k;draw()}};\ndraw();\n<\/script><\/body><\/html>\n"}, {"t": "FASTA e headers", "h": "<!doctype html>\n<html lang=\"pt-BR\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>FASTA estilo SPAdes<\/title>\n<style>\n:root{--g:#037972;--y:#f8e04d;--gr:#ebebeb;--tx:#222;--c1:#fdf0d5;--c2:#a8dcec;--c3:#9bdc9b;\n--chr:#037972;--pa:#c58a1c;--pb:#b24a44;--is:#6b5bb5}\n*{box-sizing:border-box}\nbody{margin:0;background:#fff;color:var(--tx);font-family:\"Verdana Pro\",Verdana,\"DejaVu Sans\",sans-serif;font-size:14px}\n.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 40px}\n.eyebrow{font:11px ui-monospace,Menlo,monospace;letter-spacing:.12em;color:#555;text-transform:uppercase}\nh1{margin:6px 0 6px;font-size:26px;color:var(--g)}\np.lead{margin:0 0 16px;max-width:720px;line-height:1.5;color:#444}\n.ctrl{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}\nbutton{font:inherit;font-size:13px;padding:8px 14px;border:1.5px solid var(--g);background:#fff;color:var(--g);border-radius:8px;cursor:pointer}\nbutton.on{background:var(--g);color:#fff}\n.grid{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:20px;align-items:start}\n@media(max-width:820px){.grid{grid-template-columns:1fr}}\n.card{border:1.5px solid var(--gr);border-radius:12px;padding:12px;background:#fff}\nsvg text{font-family:ui-monospace,Menlo,monospace}\n.fa{font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;max-height:430px;overflow:auto}\n.rec{padding:4px 6px;border-radius:6px;border-left:4px solid transparent;margin-bottom:2px;cursor:pointer}\n.rec.hl{background:#f4f9f8;border-left-color:var(--g)}\n.rec .seq{color:#777}\n.hd .gt{font-weight:700}\n.p{padding:1px 2px;border-radius:3px;cursor:help}\n.p1{background:var(--c1)}.p2{background:var(--c2)}.p3{background:var(--c3)}\n.p.act{outline:2px solid var(--g)}\n.dots{color:#999;padding:2px 6px}\n.legend{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}\n.chip{font:12px ui-monospace,Menlo,monospace;padding:3px 8px;border-radius:4px;cursor:help;border:1px solid #0001}\n.explain{margin-top:12px;border:1.5px dashed var(--g);background:#f4f9f8;border-radius:10px;padding:10px 12px;line-height:1.5;min-height:74px}\n.explain b{color:var(--g)}\n.note{margin-top:14px;font-size:12.5px;color:#555;line-height:1.5}\n.tag{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}\n.ctr{cursor:pointer}\n<\/style><\/head><body><div class=\"wrap\">\n<div class=\"eyebrow\">2 · O arquivo FASTA<\/div>\n<h1>Como o SPAdes nomeia cada contig?<\/h1>\n<p class=\"lead\">Cada replicon vira uma sequência no FASTA, e o cabeçalho já conta uma história. Passe o mouse nas três partes coloridas, ou clique no círculo para achar o registro correspondente.<\/p>\n<div class=\"ctrl\">\n <button id=\"bI\" class=\"on\">Mundo ideal (3 replicons → 3 contigs)<\/button>\n <button id=\"bR\">Realidade (contigs.fasta de verdade)<\/button>\n<\/div>\n<div class=\"grid\">\n <div class=\"card\"><svg id=\"svg\" viewBox=\"0 0 360 360\" width=\"100%\"><\/svg>\n  <div id=\"sum\" style=\"font-size:12.5px;color:#555;line-height:1.5;padding:4px 6px\"><\/div><\/div>\n <div>\n  <div class=\"legend\">\n   <span class=\"chip p1\" data-k=\"1\">NODE_n<\/span>\n   <span class=\"chip p2\" data-k=\"2\">length_pb<\/span>\n   <span class=\"chip p3\" data-k=\"3\">cov_kmer<\/span>\n  <\/div>\n  <div class=\"card fa\" id=\"fa\"><\/div>\n  <div class=\"explain\" id=\"ex\">Passe o mouse em uma parte do cabeçalho.<\/div>\n <\/div>\n<\/div>\n<p class=\"note\" id=\"note\"><\/p>\n<\/div>\n<script>\n// ---- dados (ilustrativos) ----\nconst IDEAL=[\n {rep:'chr',len:5231874,cov:48.7},\n {rep:'pa',len:112340,cov:101.9},\n {rep:'pb',len:5230,cov:211.4}];\nconst REAL=[\n {rep:'chr',len:1284501,cov:48.2},{rep:'chr',len:902117,cov:47.9},{rep:'chr',len:611030,cov:49.1},\n {rep:'chr',len:455882,cov:48.6},{rep:'chr',len:338774,cov:47.2},{rep:'chr',len:301245,cov:48.0},\n {rep:'chr',len:240118,cov:47.5},{rep:'chr',len:1098207,cov:48.4},\n {rep:'pa',len:61204,cov:102.4},{rep:'pa',len:38977,cov:99.8},{rep:'pa',len:7411,cov:105.0},\n {rep:'pb',len:5230,cov:211.7},\n {rep:'is',len:1312,cov:391.5}];\nconst COL={chr:'--chr',pa:'--pa',pb:'--pb',is:'--is'};\nconst NAME={chr:'cromossomo',pa:'plasmídeo A',pb:'plasmídeo B',is:'IS (repetição)'};\nlet mode='ideal',sel=null,recs=[];\nfunction rng(s){return()=>(s=(s*1664525+1013904223)>>>0)/4294967296}\nfunction seq(n,r){let a='ACGT',o='';for(let i=0;i<n;i++)o+=a[Math.floor(r()*4)];return o}\nfunction build(){\n  const d=(mode==='ideal'?IDEAL:REAL).map(x=>({...x}));\n  d.sort((a,b)=>b.len-a.len);                    // SPAdes ordena por tamanho\n  d.forEach((x,i)=>{x.id=i;x.node=i+1;x.name=`NODE_${x.node}_length_${x.len}_cov_${x.cov.toFixed(6)}`;});\n  recs=d;\n}\nconst fmt=n=>n.toLocaleString('pt-BR');\nfunction drawFa(){\n  const r=rng(7),fa=document.getElementById('fa');let h='';\n  recs.forEach(x=>{\n    const p=x.name.split('_');\n    h+=`<div class=\"rec\" data-i=\"${x.id}\"><div class=\"hd\"><span class=\"gt\">&gt;<\/span>`+\n     `<span class=\"p p1\" data-k=\"1\" data-i=\"${x.id}\">NODE_${x.node}<\/span>_`+\n     `<span class=\"p p2\" data-k=\"2\" data-i=\"${x.id}\">length_${x.len}<\/span>_`+\n     `<span class=\"p p3\" data-k=\"3\" data-i=\"${x.id}\">cov_${x.cov.toFixed(6)}<\/span><\/div>`+\n     `<div class=\"seq\">${seq(60,r)}<br>${seq(60,r)}<br>…<\/div><\/div>`;\n  });\n  if(mode==='real')h+=`<div class=\"dots\">… (+ dezenas de contigs curtos &lt; 1 kb; em um isolado real costumam ser 50–300)<\/div>`;\n  fa.innerHTML=h;\n  fa.querySelectorAll('.rec').forEach(e=>{e.onclick=()=>pick(+e.dataset.i);});\n  fa.querySelectorAll('.p').forEach(e=>{e.onmouseenter=()=>explain(+e.dataset.k,recs[+e.dataset.i],e);e.onmouseleave=()=>e.classList.remove('act');});\n}\nfunction explain(k,x,el){\n  document.querySelectorAll('.p').forEach(e=>e.classList.remove('act'));if(el)el.classList.add('act');\n  const chr=recs.filter(z=>z.rep==='chr').reduce((a,z)=>a+z.len*z.cov,0)/recs.filter(z=>z.rep==='chr').reduce((a,z)=>a+z.len,0);\n  const ratio=(x.cov/chr).toFixed(1);let t='';\n  if(k===1)t=`<b>NODE_${x.node}<\/b>: só a posição na lista. O SPAdes ordena do <b>maior para o menor<\/b>, então NODE_1 é o maior contig. O número não diz qual replicon é; aqui seria o <b>${NAME[x.rep]}<\/b>.`;\n  if(k===2)t=`<b>length_${x.len}<\/b>: tamanho do contig em pb (${fmt(x.len)} pb ≈ ${(x.len/1000).toFixed(1)} kb). É a soma de todos os nós do grafo percorridos pelo caminho. É a base do N50.`;\n  if(k===3){t=`<b>cov_${x.cov.toFixed(2)}<\/b>: cobertura de <b>k-mers<\/b> (não é a profundidade de reads). `;\n    if(x.rep==='chr')t+=`Este é o nível basal do cromossomo (≈ ${chr.toFixed(0)}×).`;\n    else t+=`É ≈ <b>${ratio}×<\/b> a do cromossomo. ${x.rep==='is'?'Coverage muito alta em contig curto = <b>repetição colapsada<\/b>: várias cópias da IS viraram um só nó.':'Plasmídeos costumam ter mais de 1 cópia por célula, então a cobertura sobe.'}`;}\n  document.getElementById('ex').innerHTML=t;\n}\nfunction drawCircles(){\n  const s=document.getElementById('svg');let o='';\n  const L=(rep)=>recs.filter(x=>x.rep===rep);\n  const cfg={chr:{cx:130,cy:130,r:100,w:12},pa:{cx:285,cy:90,r:38,w:9},pb:{cx:270,cy:215,r:22,w:8}};\n  ['chr','pa','pb'].forEach(rep=>{\n    const c=cfg[rep],C=2*Math.PI*c.r,tot=L(rep).reduce((a,x)=>a+x.len,0);let off=0;\n    const gap=L(rep).length>1?3:0;\n    L(rep).forEach(x=>{\n      const seg=Math.max(C*x.len/tot-gap,1.5);\n      o+=`<circle class=\"ctr\" data-i=\"${x.id}\" cx=\"${c.cx}\" cy=\"${c.cy}\" r=\"${c.r}\" fill=\"none\" stroke=\"var(${COL[rep]})\" stroke-width=\"${sel===x.id?c.w+5:c.w}\" stroke-dasharray=\"${seg} ${C-seg}\" stroke-dashoffset=\"${-off}\" transform=\"rotate(-90 ${c.cx} ${c.cy})\"/>`;\n      off+=C*x.len/tot;});\n    o+=`<text x=\"${c.cx}\" y=\"${rep==='pb'?c.cy+c.r+20:c.cy+4}\" text-anchor=\"middle\" font-size=\"${rep==='chr'?12:rep==='pa'?9:10}\" fill=\"var(${COL[rep]})\">${rep==='chr'?'cromossomo':rep==='pa'?'plasmídeo A':'plasmídeo B'}<\/text>`;\n  });\n  const is=recs.find(x=>x.rep==='is');\n  if(is)o+=`<circle class=\"ctr\" data-i=\"${is.id}\" cx=\"135\" cy=\"326\" r=\"${sel===is.id?9:6}\" fill=\"var(--is)\"/><text x=\"150\" y=\"330\" font-size=\"10\" fill=\"var(--is)\">IS: várias cópias, 1 contig<\/text>`;\n  s.innerHTML=o;\n  s.querySelectorAll('.ctr').forEach(e=>e.onclick=()=>pick(+e.dataset.i));\n  document.getElementById('sum').innerHTML=mode==='ideal'\n   ?'<b>3 replicons → 3 contigs.<\/b> Cada um com cobertura uniforme.'\n   :`<b>3 replicons → ${recs.length} contigs mostrados<\/b> (e dezenas de curtos fora da lista). Cada arco é um contig. O cromossomo quebra nas repetições; o plasmídeo A quebra na IS.`;\n}\nfunction pick(i){sel=i;drawCircles();\n  document.querySelectorAll('.rec').forEach(e=>e.classList.toggle('hl',+e.dataset.i===i));\n  const e=document.querySelector(`.rec[data-i=\"${i}\"]`);if(e)e.scrollIntoView({block:'nearest',behavior:'smooth'});}\nfunction setMode(m){mode=m;sel=null;build();drawFa();drawCircles();\n  bI.classList.toggle('on',m==='ideal');bR.classList.toggle('on',m==='real');\n  document.getElementById('note').innerHTML=m==='ideal'\n   ?'Formato: <code>&gt;NODE_&lt;n&gt;_length_&lt;pb&gt;_cov_&lt;k-mer cov&gt;<\/code>. No Unicycler o cabeçalho é outro: <code>&gt;1 length=5231874 depth=1.00x circular=true<\/code>; o <code>circular=true<\/code> é a confirmação de que o replicon fechou.'\n   :'Valores ilustrativos, no estilo de um isolado de <i>K. pneumoniae<\/i>. O <b>cov<\/b> separa em grupos (≈48× cromossomo, ≈100× plasmídeo A, ≈210× plasmídeo B, ≈390× IS), e é isso que ajuda a classificar contigs depois.';\n  explain(1,recs[0]);\n}\nconst bI=document.getElementById('bI'),bR=document.getElementById('bR');\nbI.onclick=()=>setMode('ideal');bR.onclick=()=>setMode('real');\ndocument.querySelectorAll('.chip').forEach(c=>c.onmouseenter=()=>explain(+c.dataset.k,recs[0]));\nsetMode('ideal');\n<\/script><\/body><\/html>\n"}, {"t": "k-mers e grafo", "h": "<!doctype html>\n<html lang=\"pt-BR\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Reads, k-mers e grafo<\/title>\n<style>\n:root{--g:#037972;--y:#f8e04d;--gr:#ebebeb;--tx:#222;--pu:#6b5bb5;--rd:#d6452f}\n*{box-sizing:border-box}\nbody{margin:0;background:#fff;color:var(--tx);font-family:\"Verdana Pro\",Verdana,\"DejaVu Sans\",sans-serif;font-size:14px}\n.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 40px}\n.eyebrow{font:11px ui-monospace,Menlo,monospace;letter-spacing:.12em;color:#555;text-transform:uppercase}\nh1{margin:6px 0 6px;font-size:26px;color:var(--g)}\np.lead{margin:0 0 16px;max-width:800px;line-height:1.5;color:#444}\n.ctrl{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center}\n.ctrl .lb{font-size:12px;color:#555;min-width:78px}\nbutton{font:inherit;font-size:13px;padding:8px 14px;border:1.5px solid var(--g);background:#fff;color:var(--g);border-radius:8px;cursor:pointer}\nbutton.on{background:var(--g);color:#fff}\nbutton.sm{padding:6px 11px;font-size:12px}\n.card{border:1.5px solid var(--gr);border-radius:12px;padding:12px 14px;background:#fff;margin-bottom:14px}\n.card h3{margin:0 0 8px;font-size:13px;color:var(--g)}\nsvg{display:block;width:100%;height:auto}\nsvg text{font-family:ui-monospace,Menlo,monospace}\n.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}\n.k{border:1.5px solid var(--gr);border-radius:10px;padding:8px 10px}\n.k small{display:block;color:#666;font-size:11px;line-height:1.3}\n.k b{font-size:20px;color:var(--g)}\n.k.hi{background:var(--y);border-color:var(--y)}.k.hi b,.k.hi small{color:#222}\n.sl{display:flex;align-items:center;gap:10px;font-size:13px;flex-wrap:wrap}\ninput[type=range]{accent-color:var(--g);width:260px}\n.explain{border:1.5px dashed var(--g);background:#f4f9f8;border-radius:10px;padding:10px 12px;line-height:1.55}\n.explain b{color:var(--g)}\n.eq{font:13px ui-monospace,Menlo,monospace;margin:6px 0 2px}\n.eq .p{background:#d4ece9;padding:1px 3px;border-radius:3px}.eq .s{background:#e6e1f7;padding:1px 3px;border-radius:3px}\n.sub{font-size:12px;color:#555;margin:0 0 6px;line-height:1.45}\n.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-top:4px}\n.leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}\ntable{border-collapse:collapse;width:100%;font-size:13px}\nth,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--gr)}\nth{font-size:12px;color:#555;font-weight:600}\n.hide{display:none!important}\n<\/style><\/head><body><div class=\"wrap\">\n<div class=\"eyebrow\">2 · Por trás da montagem<\/div>\n<h1>Da read ao grafo: k-mers, nós e arestas<\/h1>\n<p class=\"lead\">Cada <b>k-mer<\/b> é uma janela de tamanho k deslizando pela sequência. No grafo de de Bruijn ele vira uma <b>aresta (seta)<\/b> que liga dois <b>nós<\/b> de tamanho k−1: o prefixo e o sufixo do k-mer. Use o controle de passos para construir o grafo k-mer por k-mer.<\/p>\n<div class=\"ctrl\" id=\"md\"><\/div>\n<div class=\"ctrl hide\" id=\"vr\"><\/div>\n<div class=\"ctrl hide\" id=\"sb\"><\/div>\n<div class=\"kpis\" id=\"kp\"><\/div>\n\n<div id=\"main\">\n <div class=\"card\"><h3>1 · Reads e janela de k-mer<\/h3><p class=\"sub\" id=\"rd\"><\/p><svg id=\"sq\" viewBox=\"0 0 1000 170\"><\/svg>\n  <div class=\"eq\" id=\"eq\"><\/div><\/div>\n <div class=\"card hide\" id=\"cvc\"><h3>Cobertura de cada k-mer (quantas reads o contêm)<\/h3><svg id=\"cv\" viewBox=\"0 0 1000 110\"><\/svg>\n  <div class=\"leg\"><span><i style=\"background:#037972\"><\/i>caminho principal<\/span><span><i style=\"background:#f8e04d;border:1px solid #037972\"><\/i>ramo alternativo<\/span><span id=\"thl\" class=\"hide\">linha tracejada = limiar de limpeza<\/span><\/div><\/div>\n <div class=\"card\"><h3 id=\"gt\">2 · O grafo<\/h3>\n  <svg id=\"gr\" viewBox=\"0 0 1000 260\"><\/svg>\n  <div class=\"leg hide\" id=\"gl\"><span>espessura da seta = cobertura<\/span><span><i style=\"background:#f8e04d;border:1px solid #037972;border-radius:50%\"><\/i>nó de bifurcação/junção<\/span><span><i style=\"background:#6b5bb5;border-radius:50%\"><\/i>ponta<\/span><\/div>\n  <div class=\"sl\" style=\"margin-top:8px\"><button class=\"sm\" id=\"pl\">▶ construir<\/button>\n   <span>passo:<\/span><input type=\"range\" id=\"st\" min=\"0\" max=\"5\" value=\"5\"><b id=\"sv\"><\/b>\n   <button class=\"sm hide\" id=\"cp\">comprimir caminhos lineares (contigs)<\/button>\n   <span class=\"hide\" id=\"cl\"><button class=\"sm\" id=\"cb\">limpar ramos de baixa cobertura<\/button>\n    <span style=\"font-size:12px\">limiar: cov &lt; <button class=\"sm\" id=\"tm\">−<\/button> <b id=\"tv\">2<\/b> <button class=\"sm\" id=\"tp\">+<\/button><\/span><\/span><\/div><\/div>\n<\/div>\n\n<div id=\"pe\" class=\"hide\">\n <div class=\"card\"><h3>1 · De onde vêm as paired-end<\/h3>\n  <p class=\"sub\">O DNA é fragmentado em pedaços de tamanho conhecido (o <b>inserto<\/b>). O sequenciador lê só as <b>duas pontas<\/b> de cada fragmento: R1 pela ponta esquerda (fita direta) e R2 pela ponta direita (fita reversa). O meio não é sequenciado, mas sabemos que R1 e R2 estão separadas por cerca do tamanho do inserto.<\/p>\n  <svg id=\"pe1\" viewBox=\"0 0 1000 215\"><\/svg><\/div>\n <div class=\"card\"><h3>2 · Os pares sobre os contigs do grafo com repetição (A, X, B, X, C)<\/h3>\n  <div class=\"sl\" style=\"margin-bottom:6px\">tamanho do inserto: <input type=\"range\" id=\"ins\" min=\"40\" max=\"140\" value=\"100\"> <b id=\"iv\"><\/b><\/div>\n  <svg id=\"pe2\" viewBox=\"0 0 1000 250\"><\/svg>\n  <div class=\"leg\"><span><i style=\"background:#037972\"><\/i>par liga dois contigs únicos (informativo)<\/span><span><i style=\"background:#bbb\"><\/i>uma ponta cai na repetição X (ambígua: cabe nas 2 cópias)<\/span><span><i style=\"background:#9fcfca\"><\/i>as duas pontas no mesmo contig (sem informação de ordem)<\/span><\/div><\/div>\n <div class=\"card\"><h3>3 · Links e scaffold<\/h3><table id=\"pt\"><\/table><svg id=\"pe3\" viewBox=\"0 0 1000 90\" style=\"margin-top:10px\"><\/svg><\/div>\n<\/div>\n<div class=\"explain\" id=\"ex\"><\/div>\n<\/div>\n<script>\nconst SVGNS='http://www.w3.org/2000/svg';\nfunction rng(s){return()=>(s=(s*1664525+1013904223)>>>0)/4294967296}\nfunction rnd(n,seed){const r=rng(seed),a='ACGT';let o='';for(let i=0;i<n;i++)o+=a[Math.floor(r()*4)];return o}\nfunction mut(seq,p){const b=seq[p],alt='ACGT'.replace(b,'');return seq.slice(0,p)+alt[(p*7)%3]+seq.slice(p+1)}\nconst MODES={'k = 3 (exemplo AAABBBBA)':{k:3,S:'AAABBBBA',toy:true},'k = 5 (mesmo exemplo)':{k:5,S:'AAABBBBA',toy:true},'k = 21 (SPAdes)':{k:21,toy:false}};\nconst VARS=['sem repetição','tip (ponta)','bubble (bolha)','repetição longa','paired-end'];\nlet mode='k = 3 (exemplo AAABBBBA)',vr=VARS[0],sub='erro',step=0,comp=false,clean=false,thr=2,timer=null,ins=100;\nlet S,K,reads,toy,Sref,RL;\nconst BASE=rnd(100,5);\nfunction seqRep(r){return rnd(14,21)+rnd(r,24)+rnd(14,22)+rnd(r,24)+rnd(14,23)}\nfunction mkReads(seq,starts,len,hap){return starts.map(st=>({s:seq.slice(st,st+len),st,hap:hap||1,mut:[]}))}\nfunction setup(){\n const m=MODES[mode];K=m.k;toy=m.toy;comp=false;clean=false;thr=2;\n if(toy){S=m.S;Sref=S;reads=[{s:S,st:0,hap:1,mut:[]}];RL=S.length}\n else if(vr!=='paired-end'){\n  const st=[];for(let i=0;i<=40;i+=4)st.push(i);\n  if(vr==='sem repetição'){S=BASE;Sref=S;RL=60;reads=mkReads(S,st,60)}\n  else if(vr==='tip (ponta)'){S=BASE;Sref=S;RL=60;reads=mkReads(S,st,60);\n   if(sub==='erro'){const r=reads.find(x=>x.st===28);const p=83;r.s=mut(S,p).slice(28,88);r.mut=[p]}\n   else{const S1=mut(S,86);reads=reads.concat(mkReads(S1,[28,32,36,40],60,2).map(r=>({...r,mut:[86]})))}}\n  else if(vr==='bubble (bolha)'){S=BASE;Sref=S;RL=60;reads=mkReads(S,st,60);\n   if(sub==='erro'){const r=reads.find(x=>x.st===20);r.s=mut(S,50).slice(20,80);r.mut=[50]}\n   else{const S1=mut(S,50),st2=[];for(let i=2;i<=38;i+=4)st2.push(i);reads=reads.concat(mkReads(S1,st2,60,2).map(r=>({...r,mut:[50]})))}}\n  else{S=seqRep(30);Sref=S;RL=36;const s2=[];for(let i=0;i+36<=S.length;i+=4)s2.push(i);if(s2[s2.length-1]+36<S.length)s2.push(S.length-36);reads=mkReads(S,s2,36)}\n }else{S=BASE;Sref=S;RL=60;reads=[]}\n const n=S.length-K+1;const sl=document.getElementById('st');sl.max=n-1;step=n-1;sl.value=step;stop()}\nfunction ui(){\n const d=document.getElementById('md');d.innerHTML='';\n Object.keys(MODES).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.className=k===mode?'on':'';b.onclick=()=>{mode=k;if(MODES[k].toy&&vr==='paired-end')vr=VARS[0];setup();ui();draw()};d.appendChild(b)});\n const v=document.getElementById('vr');v.className='ctrl'+(toy?' hide':'');v.innerHTML='<span class=\"lb\">cenário:<\/span>';\n VARS.forEach(k=>{const b=document.createElement('button');b.textContent=k;b.className='sm'+(k===vr?' on':'');b.onclick=()=>{vr=k;sub='erro';setup();ui();draw()};v.appendChild(b)});\n const s=document.getElementById('sb');const hasSub=!toy&&(vr.startsWith('tip')||vr.startsWith('bubble'));\n s.className='ctrl'+(hasSub?'':' hide');s.innerHTML='<span class=\"lb\">o ramo é:<\/span>';\n [['erro','erro de sequenciamento (1 read)'],['real','variante real (muitas reads)']].forEach(([k,l])=>{const b=document.createElement('button');b.textContent=l;b.className='sm'+(k===sub?' on':'');b.onclick=()=>{sub=k;setup();ui();draw()};s.appendChild(b)});\n document.getElementById('cp').className='sm'+(toy||vr==='paired-end'?' hide':'');\n document.getElementById('cl').className=hasSub?'':'hide';\n document.getElementById('cvc').className='card'+(toy||vr==='paired-end'?' hide':'');\n document.getElementById('gl').className='leg'+(toy?' hide':'');\n document.getElementById('main').className=vr==='paired-end'&&!toy?'hide':'';\n document.getElementById('pe').className=vr==='paired-end'&&!toy?'':'hide';\n document.getElementById('kp').className=vr==='paired-end'&&!toy?'kpis hide':'kpis';sync()}\n// ---- grafo a partir das reads ----\nfunction build(j){\n const E=new Map(),npos=new Map();\n const ref=new Set(),refN=new Set();\n for(let i=0;i+K<=Sref.length;i++){const km=Sref.slice(i,i+K);ref.add(km);refN.add(km.slice(0,K-1));refN.add(km.slice(1))}\n reads.forEach(r=>{for(let i=0;i+K<=r.s.length;i++){const p=r.st+i;if(p>j)continue;\n  const km=r.s.slice(i,i+K),a=km.slice(0,K-1),b=km.slice(1),key=a+'>'+b;\n  if(!E.has(key))E.set(key,{a,b,km,cov:0,pos:p,alt:!ref.has(km),pl:[]});\n  const e=E.get(key);e.cov++;e.pos=Math.min(e.pos,p);if(toy)e.pl.push(p+1);\n  if(!npos.has(a)||npos.get(a)>p)npos.set(a,p);if(!npos.has(b)||npos.get(b)>p+1)npos.set(b,p+1)}});\n return{E,npos,refN}}\nfunction groups(E,refN){ // ramos alternativos conectados por nós alternativos\n const alt=[...E.values()].filter(e=>e.alt),par=alt.map((_,i)=>i);\n const f=i=>par[i]===i?i:(par[i]=f(par[i]));const byN=new Map();\n alt.forEach((e,i)=>[e.a,e.b].forEach(n=>{if(refN.has(n))return;if(byN.has(n))par[f(i)]=f(byN.get(n));else byN.set(n,i)}));\n const g=new Map();alt.forEach((e,i)=>{const r=f(i);if(!g.has(r))g.set(r,[]);g.get(r).push(e)});return[...g.values()]}\nfunction el(t,a,txt){const e=document.createElementNS(SVGNS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!==undefined)e.textContent=txt;return e}\nfunction drawSeq(){\n const L=Sref.length,cw=Math.min(toy?40:12,960/L),ox=20,sv=document.getElementById('sq');sv.innerHTML='';\n const fs=toy?26:Math.min(13,cw*1.15),nr=reads.length,rowH=toy?0:Math.min(7,100/nr),j=step;\n sv.appendChild(el('rect',{x:ox+j*cw-1,y:20,width:K*cw+2,height:toy?64:140,fill:'#f8e04d',opacity:.55,rx:4}));\n sv.appendChild(el('rect',{x:ox+j*cw,y:12,width:(K-1)*cw,height:5,fill:'#037972',rx:2}));\n if(toy)sv.appendChild(el('rect',{x:ox+(j+1)*cw,y:88,width:(K-1)*cw,height:5,fill:'#6b5bb5',rx:2}));\n for(let i=0;i<L;i++)sv.appendChild(el('text',{x:ox+i*cw+cw/2,y:toy?62:44,'text-anchor':'middle','font-size':fs,fill:'#222','font-weight':(i>=j&&i<j+K)?700:400},Sref[i]));\n if(!toy){sv.appendChild(el('rect',{x:ox+(j+1)*cw,y:50,width:(K-1)*cw,height:4,fill:'#6b5bb5',rx:2}));\n  reads.forEach((r,i)=>{const y=60+i*rowH,h=Math.max(rowH-1.5,2.5),inW=r.st<=j&&r.st+r.s.length>=j+K;\n   sv.appendChild(el('rect',{x:ox+r.st*cw,y,width:r.s.length*cw,height:h,fill:r.hap===2?(inW?'#6b5bb5':'#c9bff0'):(inW?'#037972':'#9fcfca'),rx:1.5}));\n   r.mut.forEach(p=>sv.appendChild(el('rect',{x:ox+p*cw,y:y-.5,width:Math.max(cw,3),height:h+1,fill:r.hap===2?'#f8e04d':'#d6452f'})))})}\n else{for(let i=0;i<L;i++)sv.appendChild(el('text',{x:ox+i*cw+cw/2,y:112,'text-anchor':'middle','font-size':11,fill:'#999'},i+1));\n  sv.appendChild(el('text',{x:ox,y:138,'font-size':11,fill:'#555'},'a \"read\" aqui é o próprio genoma de 8 letras; os números são as posições'))}\n const km=Sref.slice(j,j+K),a=km.slice(0,K-1),b=km.slice(1),sh=(x,n)=>x.length>n?x.slice(0,6)+'…'+x.slice(-6):x;\n document.getElementById('eq').innerHTML=`k-mer ${j+1}: <b>${km.length>26?km.slice(0,10)+'…'+km.slice(-10):km}<\/b> &nbsp;=&nbsp; prefixo <span class=\"p\">${sh(a,14)}<\/span> (nó de origem) → sufixo <span class=\"s\">${sh(b,14)}<\/span> (nó de destino)`;\n const hasErr=reads.some(r=>r.hap===1&&r.mut.length),hap2=reads.some(r=>r.hap===2);\n document.getElementById('rd').innerHTML=toy?'O k-mer desliza uma letra por vez. Barra verde = prefixo (k−1); barra roxa = sufixo (k−1); eles se sobrepõem em k−2 letras.':\n  `${reads.length} reads de ${RL} nt (barras) cobrem a sequência; cada read gera ${RL-K+1} k-mers, e as reads sobrepostas geram os mesmos k-mers várias vezes. Barras escuras = reads que contêm a janela atual.`+(hasErr?' <b style=\"color:#d6452f\">Marca vermelha = base errada nessa read.<\/b>':'')+(hap2?' <b style=\"color:#6b5bb5\">Barras roxas = reads da 2ª versão (variante), com a base diferente em amarelo.<\/b>':'')}\nfunction drawGraph(){\n const g=document.getElementById('gr');g.innerHTML='';\n g.appendChild(el('defs',{})).innerHTML='<marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerUnits=\"userSpaceOnUse\" markerWidth=\"9\" markerHeight=\"9\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"#037972\"/><\/marker><marker id=\"ay\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerUnits=\"userSpaceOnUse\" markerWidth=\"9\" markerHeight=\"9\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"#222\"/><\/marker>';\n const full=comp||clean,{E:E0,npos,refN}=build(full?S.length:step);\n let E=E0,removed=[];\n if(clean&&!toy){groups(E0,refN).forEach(gp=>{const m=gp.reduce((a,e)=>a+e.cov,0)/gp.length;if(m<thr)gp.forEach(e=>{removed.push(e);E.delete(e.a+'>'+e.b)})})}\n const N=new Set();E.forEach(e=>{N.add(e.a);N.add(e.b)});\n const ind=new Map(),outd=new Map();E.forEach(e=>{outd.set(e.a,(outd.get(e.a)||0)+1);ind.set(e.b,(ind.get(e.b)||0)+1)});\n const nodes=[...N].sort((a,b)=>npos.get(a)-npos.get(b)),nAll=Math.max(S.length-K,1);\n const Y=toy?135:165,YA=95;\n const px=n=>toy?(nodes.length>1?110+nodes.indexOf(n)*(780/(nodes.length-1)):500):30+npos.get(n)*(940/nAll);\n const py=n=>toy?Y:(refN.has(n)?Y:YA);\n const km=Sref.slice(step,step+K),curKey=km.slice(0,K-1)+'>'+km.slice(1);\n let edges=[...E.values()];\n if(comp){const J=new Set(nodes.filter(n=>!((ind.get(n)||0)===1&&(outd.get(n)||0)===1)));\n  const out=new Map();E.forEach(e=>{if(!out.has(e.a))out.set(e.a,[]);out.get(e.a).push(e)});\n  const ce=[];J.forEach(u=>(out.get(u)||[]).forEach(e0=>{let c=1,v=e0.b,cv=e0.cov,alt=e0.alt;while(!J.has(v)){const e=out.get(v)[0];v=e.b;c++;cv+=e.cov;alt=alt||e.alt}ce.push({a:u,b:v,nt:c+K-1,cov:cv/c,alt,comp:true})}));\n  edges=ce;nodes.splice(0,nodes.length,...nodes.filter(n=>J.has(n)))}\n const par=new Map();edges.forEach(e=>{const k=e.a+'|'+e.b;par.set(k,(par.get(k)||0)+1)});const seen=new Map();\n edges.forEach(e=>{\n  const xa=px(e.a),xb=px(e.b),ya=py(e.a),yb=py(e.b),isCur=!comp&&!clean&&(e.a+'>'+e.b)===curKey;\n  const w=toy?2.2:Math.min(1.2+e.cov*0.3,4);\n  const st={fill:'none',stroke:isCur?'#222':(e.alt&&!toy?'#b89a00':'#037972'),'stroke-width':comp?3.5:w,'marker-end':isCur?'url(#ay)':'url(#ar)'};\n  let lx,ly;\n  if(e.a===e.b){const r=20;g.appendChild(el('path',{...st,d:`M${xa-9} ${ya-15} C ${xa-r*1.6} ${ya-r*3.2}, ${xa+r*1.6} ${ya-r*3.2}, ${xa+9} ${ya-15}`}));lx=xa;ly=ya-r*2.7}\n  else{const dx=xb-xa,off=toy?27:5,adj=Math.abs(dx)<(toy?340:16)&&ya===yb,dy=yb-ya;\n   const k=e.a+'|'+e.b,multi=par.get(k)>1,idx=seen.get(k)||0;seen.set(k,idx+1);\n   if(!toy&&ya!==yb||(adj&&!multi)||(!toy&&dx>0&&!multi)){\n    const len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len,pad=toy?27:(ya!==yb?5:5);\n    g.appendChild(el('line',{...st,x1:xa+ux*pad,y1:ya+uy*pad,x2:xb-ux*pad,y2:yb-uy*pad}));lx=(xa+xb)/2;ly=(ya+yb)/2-9}\n   else{const h=Math.min(18+Math.abs(dx)*0.3,100),dir=multi?(idx===0?1:-1):(dx>0?-1:1),hh=h*(multi?.9:1);\n    g.appendChild(el('path',{...st,d:`M${xa} ${ya+dir*(toy?14:4)} Q ${(xa+xb)/2} ${ya+dir*hh*1.9} ${xb} ${yb+dir*(toy?14:4)}`}));lx=(xa+xb)/2;ly=ya+dir*hh*0.95+(dir<0?-4:12)}}\n  if(toy){const lab=e.pl.filter(p=>p<=step+1).join(', ');\n   g.appendChild(el('text',{x:lx,y:ly-(e.a===e.b?16:4),'text-anchor':'middle','font-size':16,'font-weight':700,fill:'#d6452f'},lab));\n   g.appendChild(el('text',{x:lx,y:ly+(e.a===e.b?-2:12),'text-anchor':'middle','font-size':10,fill:'#777'},e.km+(e.cov>1?' ×'+e.cov:'')))}\n  else if(comp)g.appendChild(el('text',{x:lx,y:ly,'text-anchor':'middle','font-size':12,'font-weight':700,fill:e.alt?'#9a7f00':'#037972'},e.nt+' nt · cov '+e.cov.toFixed(1)))});\n nodes.forEach(n=>{const x=px(n),y=py(n),junc=(ind.get(n)||0)>1||(outd.get(n)||0)>1,end=(ind.get(n)||0)===0||(outd.get(n)||0)===0;\n  if(toy){g.appendChild(el('rect',{x:x-27,y:y-15,width:54,height:30,rx:4,fill:junc?'#f8e04d':'#fff',stroke:'#222','stroke-width':1.6}));\n   g.appendChild(el('text',{x,y:y+5,'text-anchor':'middle','font-size':n.length>3?13:15,'font-weight':700,fill:'#3b5bdb'},n))}\n  else{const c=el('circle',{cx:x,cy:y,r:comp?7:(junc?6:4),fill:junc?'#f8e04d':(end?'#6b5bb5':'#fff'),stroke:'#037972','stroke-width':comp?2.5:1.5});c.appendChild(el('title',{},n));g.appendChild(c)}});\n if(!toy&&!comp&&!clean){const kk=Sref.slice(step,step+K),b=kk.slice(1),a=kk.slice(0,K-1);\n  [[a,'origem',1],[b,'destino',2]].forEach(([n,l,i])=>{if(npos.get(n)===undefined)return;g.appendChild(el('text',{x:Math.min(Math.max(px(n),90),910),y:i===1?22:250,'text-anchor':'middle','font-size':10,fill:i= os (k−1 = ${K-1} nt)<\/small><b>${nodesF.size}<\/b><\/div>`+\n  `<div class=\"k\"><small>comprimento da sequência<\/small><b>${S.length} nt<\/b><\/div>`+\n  (toy?'':`<div class=\"k\"><small>cobertura de k-mer (média)<\/small><b>${(nKm/EF.size).toFixed(1)}×<\/b><\/div>`);\n document.getElementById('sv').textContent=`${Math.min(step+1,S.length-K+1)} / ${S.length-K+1}`;\n document.getElementById('tv').textContent=thr;\n document.getElementById('gt').textContent=comp?'2 · O grafo comprimido: cada seta é um contig (caminho sem ramificação)':'2 · O grafo, aresta por aresta';\n explain(removed)}\nfunction explain(removed){\n let ex='';const n=S.length-K+1;\n if(mode.startsWith('k = 3'))ex='<b>Leitura:<\/b> o genoma AAABBBBA tem 8 letras, então gera <b>6 k-mers<\/b> de 3 letras (um por posição). Cada k-mer liga dois nós de 2 letras: AAA liga AA→AA (laço), AAB liga AA→AB, ABB liga AB→BB, BBB liga BB→BB (laço, e aparece <b>2 vezes<\/b>), BBA liga BB→BA. Resultado: <b>4 nós<\/b> e 5 setas distintas. Remontar o genoma é percorrer as setas na ordem <b style=\"color:#d6452f\">1→2→3→4→5→6<\/b>: AAABBBBA. Os laços e a seta repetida mostram como k pequeno cria ambiguidade.';\n else if(mode.startsWith('k = 5'))ex='<b>Leitura:<\/b> com k = 5 o mesmo genoma gera só 4 k-mers e <b>nenhum laço<\/b>: AAAB→AABB→ABBB→BBBB→BBBA, uma fila simples. O k maior \"desdobrou\" o trecho BBB repetido, e o caminho agora é único.';\n else if(vr==='sem repetição')ex=comp?'<b>Leitura:<\/b> sem ramificação, todo o caminho se comprime em <b>uma única seta = 1 contig<\/b>.':'<b>Leitura:<\/b> com k = 21 cada nó tem 20 nt e todos os k-mers são únicos: o grafo é uma <b>fila simples de '+n+' arestas<\/b>. A cobertura sobe no meio e cai nas pontas (poucas reads cobrem as extremidades). Roxo = ponta (início e fim). Comprima o caminho para ver virar 1 contig.';\n else if(vr.startsWith('tip'))ex=(sub==='erro'?\n  '<b>Tip por erro de sequenciamento.<\/b> Uma única read tem uma base errada perto do fim (onde a qualida
