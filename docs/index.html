r1,r2].sort().join('-')]++;cls='link'}\n  const col=cls==='link'?'#037972':cls==='same'?'#9fcfca':'#bbb',x1=sx(c1),x2=sx(c2);\n  if(s%12===0)b.appendChild(el('path',{d:`M${x1} 146 Q ${(x1+x2)/2} ${146-Math.min(20+(x2-x1)*0.45,120)} ${x2} 146`,fill:'none',stroke:col,'stroke-width':cls==='link'?1.8:1,'stroke-dasharray':cls==='amb'?'3 3':'',opacity:cls==='link'?.85:.55}));\n  }\n {const s=12;b.appendChild(el('rect',{x:sx(s),y:180,width:sx(s+RLp)-sx(s),height:6,fill:'#037972'}));b.appendChild(el('rect',{x:sx(s+ins-RLp),y:180,width:sx(s+ins)-sx(s+ins-RLp),height:6,fill:'#6b5bb5'}));\n  b.appendChild(el('text',{x:sx(s),y:202,'font-size':11,fill:'#037972'},'R1 de um par exemplo'));b.appendChild(el('text',{x:sx(s+ins),y:202,'text-anchor':'end','font-size':11,fill:'#6b5bb5'},'R2 do mesmo par'))}\n b.appendChild(el('text',{x:40,y:20,'font-size':11,fill:'#555'},'cada arco = 1 par (R1 em um extremo, R2 no outro); inserto = '+ins+' nt; repetição X = 30 nt'));\n // tabela e scaffold\n const ok=cnt['A-B']>=3&&cnt['B-C']>=3;\n document.getElementById('pt').innerHTML='<tr><th>ligação<\/th><th>pares que ancoram em 2 contigs únicos<\/th><th>o que diz<\/th><\/tr>'+\n  `<tr><td><b>A ↔ B<\/b><\/td><td>${cnt['A-B']}<\/td><td>${cnt['A-B']>=3?'A e B estão próximos, com X no meio':'sem evidência'}<\/td><\/tr>`+\n  `<tr><td><b>B ↔ C<\/b><\/td><td>${cnt['B-C']}<\/td><td>${cnt['B-C']>=3?'B e C estão próximos, com X no meio':'sem evidência'}<\/td><\/tr>`+\n  `<tr><td><b>A ↔ C<\/b><\/td><td>${cnt['A-C']}<\/td><td>${cnt['A-C']?'distância longa: coerente com A…B…C':'nenhum (esperado: estão longe)'}<\/td><\/tr>`+\n  `<tr><td>com uma ponta em X<\/td><td>${cnt.amb}<\/td><td>ambíguos: a ponta cabe nas 2 cópias de X<\/td><\/tr>`+\n  `<tr><td>as duas pontas no mesmo contig<\/td><td>${cnt.same}<\/td><td>confirmam cobertura, mas não dão ordem<\/td><\/tr>`;\n const c=document.getElementById('pe3');c.innerHTML='';\n const seq=ok?['A','X','B','X','C']:['A','B','C','X'];\n seq.forEach((n,i)=>{const w=ok?150:110,x=40+i*(w+(ok?26:60));c.appendChild(el('rect',{x,y:20,width:w,height:34,rx:4,fill:n==='X'?'#f8e04d':'#037972',stroke:n==='X'?'#037972':'none'}));\n  c.appendChild(el('text',{x:x+w/2,y:42,'text-anchor':'middle','font-size':14,'font-weight':700,fill:n==='X'?'#222':'#fff'},n));\n  if(ok&&i<4)c.appendChild(el('text',{x:x+w+13,y:42,'text-anchor':'middle','font-size':14,fill:'#222'},'→'))});\n c.appendChild(el('text',{x:40,y:80,'font-size':12,fill:ok?'#037972':'#d6452f','font-weight':700},ok?'scaffold: A – X – B – X – C (ordem resolvida pelos pares)':'sem scaffold: 4 contigs soltos, ordem desconhecida'));\n document.getElementById('ex').innerHTML=ok?\n  '<b>Leitura:<\/b> os pares com <b>R1 no contig único A e R2 no contig único B<\/b> mostram que A e B estão próximos, com a repetição X entre eles; o mesmo vale para B e C. Juntando: <b>A–X–B–X–C<\/b>. É assim que as paired-end viram <b>scaffolds<\/b> (no SPAdes, o <code>scaffolds.fasta<\/code>; lacunas viram sequências de N quando o trecho não é conhecido). Os pares com uma ponta dentro de X não ajudam, porque X existe em 2 lugares. <b>Regra:<\/b> o inserto precisa ser <b>maior que a repetição<\/b> (aqui 30 nt) para que as duas pontas caiam em sequência única dos dois lados. No mundo real: inserto ~400 pb e IS de ~1,3 kb ⇒ Illumina curto <b>não<\/b> atravessa a IS; por isso long reads/híbrida.':\n  '<b>Leitura:<\/b> com inserto de '+ins+' nt os pares não alcançam sequência única dos dois lados da repetição X (de 30 nt): nenhum par liga A a B nem B a C, e os 4 contigs continuam sem ordem. Com inserto maior que a repetição + o tamanho das reads, surgem links entre contigs. É a mesma lógica que faz a IS de 1,3 kb quebrar a montagem com paired-end de ~400 pb.'}\nfunction draw(){if(vr==='paired-end'&&!toy){drawPE();return}drawSeq();drawGraph()}\nfunction stop(){if(timer){clearInterval(timer);timer=null}document.getElementById('pl').textContent='▶ construir'}\nconst $=id=>document.getElementById(id);\n$('st').oninput=e=>{stop();comp=false;clean=false;sync();step=+e.target.value;draw()};\nfunction sync(){$('cp').className='sm'+(comp?' on':'')+(toy||vr==='paired-end'?' hide':'');$('cb').className='sm'+(clean?' on':'')}\n$('pl').onclick=()=>{if(timer){stop();return}comp=false;clean=false;sync();const n=S.length-K;step=0;draw();$('st').value=0;$('pl').textContent='■ parar';\n timer=setInterval(()=>{if(step>=n){stop();return}step++;$('st').value=step;draw()},toy?900:90)};\n$('cp').onclick=()=>{stop();comp=!comp;sync();if(comp){step=S.length-K;$('st').value=step}draw()};\n$('cb').onclick=()=>{stop();clean=!clean;sync();if(clean){step=S.length-K;$('st').value=step}draw()};\n$('tm').onclick=()=>{thr=Math.max(1,thr-1);if(clean){}draw()};$('tp').onclick=()=>{thr=Math.min(9,thr+1);draw()};\n$('ins').oninput=e=>{ins=+e.target.value;draw()};\nsetup();ui();draw();\n<\/script><\/body><\/html>\n"}, {"t": "N50", "h": "<!doctype html>\n<html lang=\"pt-BR\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>N50 explicado<\/title>\n<style>\n:root{--g:#037972;--y:#f8e04d;--gr:#ebebeb;--tx:#222}\n*{box-sizing:border-box}\nbody{margin:0;background:#fff;color:var(--tx);font-family:\"Verdana Pro\",Verdana,\"DejaVu Sans\",sans-serif;font-size:14px}\n.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 40px}\n.eyebrow{font:11px ui-monospace,Menlo,monospace;letter-spacing:.12em;color:#555;text-transform:uppercase}\nh1{margin:6px 0 6px;font-size:26px;color:var(--g)}\np.lead{margin:0 0 16px;max-width:760px;line-height:1.5;color:#444}\n.ctrl{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}\nbutton{font:inherit;font-size:13px;padding:8px 14px;border:1.5px solid var(--g);background:#fff;color:var(--g);border-radius:8px;cursor:pointer}\nbutton.on{background:var(--g);color:#fff}\n.card{border:1.5px solid var(--gr);border-radius:12px;padding:12px 14px;background:#fff;margin-bottom:14px}\n.card h3{margin:0 0 8px;font-size:13px;color:var(--g);letter-spacing:.02em}\nsvg{display:block;width:100%;height:auto}\nsvg text{font-family:ui-monospace,Menlo,monospace}\n.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}\n.k{border:1.5px solid var(--gr);border-radius:10px;padding:8px 10px}\n.k small{display:block;color:#666;font-size:11px}\n.k b{font-size:18px;color:var(--g)}\n.k.hi{background:var(--y);border-color:var(--y)}\n.k.hi b,.k.hi small{color:#222}\n.explain{border:1.5px dashed var(--g);background:#f4f9f8;border-radius:10px;padding:10px 12px;line-height:1.55}\n.explain b{color:var(--g)}\n.sl{display:flex;align-items:center;gap:10px;font-size:13px}\ninput[type=range]{accent-color:var(--g);width:200px}\n.warn{margin-top:14px;font-size:12.5px;color:#555;line-height:1.5}\n<\/style><\/head><body><div class=\"wrap\">\n<div class=\"eyebrow\">2 · Qualidade da montagem<\/div>\n<h1>O que o N50 realmente mede?<\/h1>\n<p class=\"lead\">Ordene os contigs do maior para o menor, some os tamanhos e pare quando passar da metade do genoma. O contig em que a soma passa da metade é o <b>N50<\/b>. O mesmo genoma pode ter N50 muito diferente conforme o cenário.<\/p>\n<div class=\"ctrl\" id=\"sc\"><\/div>\n<div class=\"kpis\" id=\"kp\"><\/div>\n<div class=\"card\"><h3>Genoma montado: contigs em fila, do maior ao menor (largura = tamanho)<\/h3><svg id=\"s1\" viewBox=\"0 0 1000 120\"><\/svg><\/div>\n<div class=\"card\"><div class=\"sl\">Nx: <input type=\"range\" id=\"x\" min=\"10\" max=\"95\" step=\"5\" value=\"50\"> <b id=\"xv\">N50<\/b>\n <label style=\"margin-left:14px\"><input type=\"checkbox\" id=\"f\"> descartar contigs &lt; 1 kb<\/label><\/div><\/div>\n<div class=\"explain\" id=\"ex\"><\/div>\n<p class=\"warn\">Atenção: o N50 só diz que os contigs são <i>longos<\/i>, não que estão <i>certos<\/i>. Montagem com misassembly (junção errada) pode ter N50 ótimo. Por isso se olha junto: nº de contigs, tamanho total, completude (CheckM2/BUSCO) e, se possível, QUAST contra referência. Valores ilustrativos, em um genoma de ~5,3 Mb.<\/p>\n<\/div>\n<script>\nfunction rng(s){return()=>(s=(s*1664525+1013904223)>>>0)/4294967296}\nfunction gen(n,total,sigma,seed){const r=rng(seed);let a=[];for(let i=0;i<n;i++){const u=Math.max(r(),1e-6),v=r();\n a.push(Math.exp(sigma*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)))}\n const s=a.reduce((x,y)=>x+y,0);return a.map(x=>Math.max(200,Math.round(x/s*total)))}\nconst SC={\n 'Mundo ideal':{d:[5231874,112340,5230],t:'3 replicons, 3 contigs.'},\n 'Short reads (real)':{d:[1284501,1098207,902117,611030,455882,338774,301245,240118,61204,38977,7411,5230,1312].concat(gen(70,60000,1.0,3)),t:''},\n 'Montagem fragmentada':{d:gen(260,5350000,1.5,11),t:''}};\nlet cur='Short reads (real)';\nconst fmt=n=>n.toLocaleString('pt-BR');\nconst kb=n=>n>=1e6?(n/1e6).toFixed(2).replace('.',',')+' Mb':(n/1e3).toFixed(1).replace('.',',')+' kb';\nfunction ui(){const d=document.getElementById('sc');d.innerHTML='';Object.keys(SC).forEach(k=>{const b=document.createElement('button');b.textContent=k;\n b.className=k===cur?'on':'';b.onclick=()=>{cur=k;ui();draw()};d.appendChild(b)})}\nfunction draw(){\n const X=+document.getElementById('x').value/100,filt=document.getElementById('f').checked;\n document.getElementById('xv').textContent='N'+Math.round(X*100);\n let L=SC[cur].d.slice().sort((a,b)=>b-a);if(filt)L=L.filter(v=>v>=1000);\n const tot=L.reduce((a,b)=>a+b,0),th=tot*X;let c=0,idx=0;\n for(let i=0;i<L.length;i++){c+=L[i];if(c>=th){idx=i;break}}\n const N=L[idx],mean=tot/L.length;\n const nm='N'+Math.round(X*100),lm='L'+Math.round(X*100);\n document.getElementById('kp').innerHTML=\n  `<div class=\"k\"><small>tamanho total<\/small><b>${kb(tot)}<\/b><\/div>`+\n  `<div class=\"k\"><small>nº de contigs<\/small><b>${fmt(L.length)}<\/b><\/div>`+\n  `<div class=\"k\"><small>maior contig<\/small><b>${kb(L[0])}<\/b><\/div>`+\n  `<div class=\"k\"><small>tamanho médio<\/small><b>${kb(mean)}<\/b><\/div>`+\n  `<div class=\"k hi\"><small>${nm}<\/small><b>${kb(N)}<\/b><\/div>`+\n  `<div class=\"k hi\"><small>${lm}<\/small><b>${idx+1}<\/b><\/div>`;\n // painel 1\n let s='',x=0,W=960,ox=20;\n L.forEach((v,i)=>{const w=v/tot*W;\n  const hi=i===idx;\n  s+=`<rect x=\"${ox+x}\" y=\"34\" width=\"${Math.max(w,0.6)}\" height=\"44\" fill=\"${hi?'#f8e04d':(i%2?'#037972':'#4a9e98')}\" stroke=\"${hi?'#037972':'#fff'}\" stroke-width=\"${hi?2:0.4}\"/>`;x+=w});\n s+=`<line x1=\"${ox+W*X}\" y1=\"22\" x2=\"${ox+W*X}\" y2=\"92\" stroke=\"#222\" stroke-width=\"2\" stroke-dasharray=\"4 3\"/>`;\n s+=`<text x=\"${ox+W*X}\" y=\"16\" text-anchor=\"middle\" font-size=\"12\" fill=\"#222\">${Math.round(X*100)}% do genoma (${kb(th)})<\/text>`;\n let hx=ox+L.slice(0,idx).reduce((a,b)=>a+b,0)/tot*W,hw=N/tot*W;\n s+=`<text x=\"${Math.min(Math.max(hx+hw/2,90),900)}\" y=\"108\" text-anchor=\"middle\" font-size=\"12\" fill=\"#037972\" font-weight=\"700\">${nm} = ${kb(N)} (contig nº ${idx+1})<\/text>`;\n s+=`<text x=\"${ox}\" y=\"94\" font-size=\"10\" fill=\"#777\">maior<\/text><text x=\"${ox+W}\" y=\"94\" font-size=\"10\" fill=\"#777\" text-anchor=\"end\">menor →<\/text>`;\n document.getElementById('s1').innerHTML=s;\n const ratio=mean>0?(N/mean):0;\n document.getElementById('ex').innerHTML=\n  `<b>Passo a passo:<\/b> total = ${kb(tot)}, metade = ${kb(th)}. Somando do maior para o menor, os ${idx+1} primeiro${idx?'s':''} contig${idx?'s':''} já passam da metade. O último deles tem <b>${fmt(N)} pb<\/b>: esse é o ${nm}, e o nº de contigs usados é o <b>${lm} = ${idx+1}<\/b>.<br>`+\n  `<b>Leitura:<\/b> metade do genoma está em contigs de pelo menos ${kb(N)}. A média (${kb(mean)}) é bem menor que o N50 (${ratio.toFixed(1)}×) quando há muitos contigs pequenos, e por isso o N50 é a medida preferida para continuidade.`+\n  (filt?`<br><b>Cuidado:<\/b> descartar contigs curtos mudou o total e, com ele, o N50. Só compare N50 entre montagens com o mesmo critério.`:'');\n}\ndocument.getElementById('x').oninput=draw;document.getElementById('f').onchange=draw;\nui();draw();\n<\/script><\/body><\/html>\n"}, {"t": "Completude", "h": "<!doctype html>\n<html lang=\"pt-BR\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Completude e contaminação<\/title>\n<style>\n:root{--g:#037972;--y:#f8e04d;--gr:#ebebeb;--tx:#222;--pu:#6b5bb5}\n*{box-sizing:border-box}\nbody{margin:0;background:#fff;color:var(--tx);font-family:\"Verdana Pro\",Verdana,\"DejaVu Sans\",sans-serif;font-size:14px}\n.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 40px}\n.eyebrow{font:11px ui-monospace,Menlo,monospace;letter-spacing:.12em;color:#555;text-transform:uppercase}\nh1{margin:6px 0 6px;font-size:26px;color:var(--g)}\np.lead{margin:0 0 16px;max-width:800px;line-height:1.5;color:#444}\n.ctrl{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}\nbutton{font:inherit;font-size:13px;padding:8px 14px;border:1.5px solid var(--g);background:#fff;color:var(--g);border-radius:8px;cursor:pointer}\nbutton.on{background:var(--g);color:#fff}\n.card{border:1.5px solid var(--gr);border-radius:12px;padding:12px 14px;background:#fff;margin-bottom:14px}\n.card h3{margin:0 0 10px;font-size:13px;color:var(--g)}\n.grid{display:grid;grid-template-columns:150px 150px repeat(12,minmax(44px,1fr));align-items:center;font:12px ui-monospace,Menlo,monospace;overflow-x:auto;min-width:900px}\n.gw{overflow-x:auto}\n.grid>div{padding:5px 2px;text-align:center;border-bottom:1px solid var(--gr);min-height:32px;display:flex;align-items:center;justify-content:center}\n.grid .h{color:#555;font-size:11px;border-bottom:2px solid var(--g);writing-mode:horizontal-tb}\n.grid .nm{justify-content:flex-start;padding-left:6px;cursor:pointer}\n.grid .sz{justify-content:flex-start;white-space:nowrap}.grid .nm{white-space:nowrap}\n.bar{height:10px;border-radius:3px;background:var(--g)}\n.row-off{opacity:.3;text-decoration:line-through}\n.contam{color:var(--pu);font-weight:700}\n.ghost{color:#999;font-style:italic}\n.dot{width:16px;height:16px;border-radius:50%;background:var(--g)}\n.dot.c{background:var(--pu)}\n.dot.half{background:#fff;border:2px dashed var(--g);width:16px;height:16px}\n.dot.half.c{border-color:var(--pu)}\n.dot.miss{background:#fff;border:1.5px dashed #bbb;width:14px;height:14px}\n.foot{font-weight:700}\n.n0{color:#999}.n1{color:var(--g)}.n2{background:var(--y);border-radius:4px;padding:2px 5px;color:#222}\n.gauges{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}\n@media(max-width:760px){.gauges{grid-template-columns:1fr}}\n.gcard{border:1.5px solid var(--gr);border-radius:12px;padding:12px 14px}\n.gcard small{color:#555}\n.big{font-size:30px;font-weight:700;color:var(--g)}\n.track{height:14px;background:var(--gr);border-radius:7px;overflow:hidden;margin:6px 0}\n.fill{height:100%;background:var(--g);transition:width .3s}\n.fill.y{background:var(--y)}\n.formula{font:12px ui-monospace,Menlo,monospace;color:#555}\n.explain{border:1.5px dashed var(--g);background:#f4f9f8;border-radius:10px;padding:10px 12px;line-height:1.55}\n.explain b{color:var(--g)}\n.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;margin-top:10px;align-items:center}\n.leg span{display:flex;align-items:center;gap:6px}\n.note{font-size:12.5px;color:#555;line-height:1.55;margin-top:12px}\n<\/style><\/head><body><div class=\"wrap\">\n<div class=\"eyebrow\">3 · O genoma está completo? Está puro?<\/div>\n<h1>Completude e contaminação: contando marcadores<\/h1>\n<p class=\"lead\">Aqui os marcadores são genes <b>single-copy<\/b> do cromossomo: em um genoma bom, cada um aparece <b>exatamente 1 vez<\/b>, somando todos os contigs. Faltou = genoma incompleto. Apareceu 2 vezes = contaminação (ou duplicação). Escolha um cenário e depois <b>clique em um contig<\/b> para removê-lo e ver o efeito.<\/p>\n<div class=\"ctrl\" id=\"sc\"><\/div>\n<div class=\"gauges\">\n <div class=\"gcard\"><small>Completude<\/small><div class=\"big\" id=\"cv\"><\/div><div class=\"track\"><div class=\"fill\" id=\"cb\"><\/div><\/div><div class=\"formula\" id=\"cf\"><\/div><\/div>\n <div class=\"gcard\"><small>Contaminação<\/small><div class=\"big\" id=\"kv\"><\/div><div class=\"track\"><div class=\"fill y\" id=\"kb\"><\/div><\/div><div class=\"formula\" id=\"kf\"><\/div><\/div>\n<\/div>\n<div class=\"card\"><h3>Contigs (linhas) × marcadores single-copy (colunas)<\/h3>\n <div class=\"gw\"><div class=\"grid\" id=\"gr\"><\/div><\/div>\n <div class=\"leg\">\n  <span><i class=\"dot\" style=\"width:12px;height:12px\"><\/i> marcador inteiro (conta)<\/span>\n  <span><i class=\"dot half\" style=\"width:12px;height:12px\"><\/i> gene cortado na borda do contig (não conta)<\/span>\n  <span><i class=\"dot c\" style=\"width:12px;height:12px\"><\/i> marcador de outro organismo<\/span>\n  <span><i class=\"dot miss\" style=\"width:12px;height:12px\"><\/i> não montado<\/span>\n <\/div><\/div>\n<div class=\"explain\" id=\"ex\"><\/div>\n<p class=\"note\">Valores ilustrativos: 12 marcadores no desenho, mas o BUSCO e o CheckM usam centenas por linhagem. Fórmulas simplificadas: <b>completude<\/b> = marcadores com pelo menos 1 cópia ÷ total; <b>contaminação<\/b> = cópias extras ÷ total (como no CheckM; o CheckM2 chega a valores equivalentes por outro caminho, sem contar marcadores).<\/p>\n<\/div>\n<script>\nconst M=['rpoB','gyrB','recA','rplB','rpsC','atpD','infB','dnaK','groEL','secY','rpoA','pheS'];\n// contigs do organismo-alvo (K. pneumoniae): [nome, tamanho, marcadores]\nconst T=[['NODE_1',1284501,[0,1,2]],['NODE_2',1098207,[3,4]],['NODE_3',902117,[5,6]],['NODE_4',611030,[7,8]],\n         ['NODE_5',455882,[9]],['NODE_6',338774,[10]],['NODE_7',301245,[11]],['NODE_8',240118,[]],['NODE_9',61204,[]]];\n// contaminante (outra espécie, ex.: S. mitis / K. aerogenes)\nconst X=[['NODE_21',812340,[0,1,2]],['NODE_22',644210,[3,7]],['NODE_23',210775,[11]]];\nconst SC={\n 'Genoma completo e puro':{missing:[],partial:{},cont:false,\n  ex:'<b>Cada marcador aparece 1 vez.<\/b> 12 de 12 presentes (100%) e nenhum duplicado (0%). É o que se espera de um isolado bem montado e sem mistura. Os contigs sem marcador (NODE_8, NODE_9) são só sequência a mais; não alteram o resultado.'},\n 'Baixa completude (erro de montagem)':{missing:[2,4,5],partial:{1:[4],3:[8]},cont:false,\n  ex:'<b>Faltam marcadores, mas nada está duplicado.<\/b> Regiões de baixa cobertura ou resolvidas errado viram contigs ausentes (NODE_3, 5 e 6 não foram recuperados; podem ter sido descartados por filtro de tamanho/cobertura). E genes que caem na borda de um contig ficam cortados e o anotador não os reconhece (círculos tracejados). Resultado: genoma incompleto, mas <b>puro<\/b>. A saída é melhorar a montagem (mais cobertura, long reads, outro k).'},\n 'Alta contaminação':{missing:[],partial:{},cont:true,\n  ex:'<b>Tudo presente, mas várias cópias.<\/b> Os contigs roxos vêm de outra espécie que entrou no mesmo bin: reads de outro isolado, <i>cross-talk<\/i> entre amostras ou co-montagem. Como o outro organismo também tem rpoB, gyrB etc., os marcadores aparecem em duplicata. A completude continua 100% e <b>isso engana<\/b>: por isso é preciso olhar as duas métricas. A saída é separar o bin (binning por cobertura/composição, ou filtrar por taxonomia).'},\n 'Os dois (bin ruim)':{missing:[2,4,5],partial:{1:[4],3:[8]},cont:true,\n  ex:'<b>Incompleto e misturado.<\/b> Pior caso típico de MAG de baixa qualidade: faltam marcadores do alvo e ainda há contigs de outro organismo. Compare com o cenário 1: o genoma tem aproximadamente o mesmo tamanho total, mas o conteúdo é outro. Tamanho e N50 <b>não<\/b> mostram isso; só os marcadores.'}};\nlet cur='Genoma completo e puro',off=new Set();\nconst fmt=n=>(n/1e3).toLocaleString('pt-BR',{maximumFractionDigits:0})+' kb';\nfunction ui(){const d=document.getElementById('sc');d.innerHTML='';Object.keys(SC).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.className=k===cur?'on':'';b.onclick=()=>{cur=k;off=new Set();ui();draw()};d.appendChild(b)})}\nfunction draw(){\n const s=SC[cur];const rows=[];\n T.forEach((t,i)=>{const gone=s.missing.includes(i);rows.push({id:'t'+i,n:t[0],len:t[1],m:t[2],gone,c:false,part:(s.partial[i]||[])})});\n if(s.cont)X.forEach((t,i)=>rows.push({id:'x'+i,n:t[0],len:t[1],m:t[2],gone:false,c:true,part:[]}));\n const cnt=new Array(12).fill(0);\n rows.forEach(r=>{if(r.gone||off.has(r.id))return;r.m.forEach(m=>{if(!r.part.includes(m))cnt[m]++})});\n const comp=cnt.filter(x=>x>=1).length,extra=cnt.reduce((a,x)=>a+Math.max(x-1,0),0);\n const maxlen=1300000;\n let h='<div class=\"h\" style=\"justify-content:flex-start;padding-left:6px\">contig<\/div><div class=\"h\">tamanho<\/div>'+M.map(m=>`<div class=\"h\">${m}<\/div>`).join('');\n rows.forEach(r=>{\n  const o=off.has(r.id),cls=r.gone?'ghost':(o?'row-off':'');\n  h+=`<div class=\"nm ${cls} ${r.c?'contam':''}\" data-id=\"${r.id}\" ${r.gone?'':'title=\"clique para remover/reincluir\"'}>${r.n}${r.c?' (outro)':''}${r.gone?' (ausente)':''}<\/div>`;\n  h+=`<div class=\"sz ${cls}\">${r.gone?'':`<span class=\"bar\" style=\"width:${Math.max(r.len/maxlen*70,2)}px;${r.c?'background:var(--pu)':''}\"><\/span>&nbsp;${fmt(r.len)}`}<\/div>`;\n  for(let m=0;m<12;m++){let c='';const has=r.m.includes(m);\n   if(has){if(r.gone)c='<i class=\"dot miss\"><\/i>';else if(r.part.includes(m))c=`<i class=\"dot half ${r.c?'c':''}\"><\/i>`;else c=`<i class=\"dot ${r.c?'c':''}\"><\/i>`}\n   h+=`<div class=\"${cls}\">${c}<\/div>`}\n });\n h+='<div class=\"foot\" style=\"justify-content:flex-start;padding-left:6px;grid-column:1/3\">cópias no total<\/div>'+cnt.map(x=>`<div class=\"foot ${x===0?'n0':x===1?'n1':''}\">${x===0?'0':x===1?'1':`<span class=\"n2\">×${x}<\/span>`}<\/div>`).join('');\n document.getElementById('gr').innerHTML=h;\n document.querySelectorAll('.nm[data-id]').forEach(e=>{if(e.classList.contains('ghost'))return;e.onclick=()=>{const id=e.dataset.id;off.has(id)?off.delete(id):off.add(id);draw()}});\n const pc=Math.round(comp/12*100),pk=Math.round(extra/12*100);\n document.getElementById('cv').textContent=pc+'%';document.getElementById('cb').style.width=pc+'%';\n document.getElementById('kv').textContent=pk+'%';document.getElementById('kb').style.width=Math.min(pk,100)+'%';\n document.getElementById('cf').textContent=`${comp} de 12 marcadores com ≥ 1 cópia`;\n document.getElementById('kf').textContent=`${extra} cópias extras ÷ 12 marcadores`;\n document.getElementById('ex').innerHTML=s.ex+(off.size?'<br><b>Contigs removidos:<\/b> a completude cai quando o contig carrega marcadores, e como a contaminação cai ao remover os contigs roxos.':'');\n}\nui();draw();\n<\/script><\/body><\/html>\n"}, {"t": "Plasmídeos", "h": "<!doctype html>\n<html lang=\"pt-BR\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Plasmídeos<\/title>\n<style>\n:root{--g:#037972;--y:#f8e04d;--gr:#ebebeb;--tx:#222;--pu:#6b5bb5;--am:#c58a1c}\n*{box-sizing:border-box}\nbody{margin:0;background:#fff;color:var(--tx);font-family:\"Verdana Pro\",Verdana,\"DejaVu Sans\",sans-serif;font-size:14px}\n.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 40px}\n.eyebrow{font:11px ui-monospace,Menlo,monospace;letter-spacing:.12em;color:#555;text-transform:uppercase}\nh1{margin:6px 0 6px;font-size:26px;color:var(--g)}\np.lead{margin:0 0 14px;max-width:860px;line-height:1.5;color:#444}\n.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}\n.tabs button{font:inherit;font-size:12.5px;padding:8px 13px;border:1.5px solid var(--g);background:#fff;color:var(--g);border-radius:8px;cursor:pointer}\n.tabs button i{font-style:normal;font-weight:700;margin-right:5px}\n.tabs button.on{background:var(--g);color:#fff}\n.card{border:1.5px solid var(--gr);border-radius:12px;padding:12px 14px;background:#fff;margin-bottom:14px}\n.card h3{margin:0 0 8px;font-size:14px;color:var(--g)}\nsvg{display:block;width:100%;height:auto}\nsvg text{font-family:ui-monospace,Menlo,monospace}\n.explain{border:1.5px dashed var(--g);background:#f4f9f8;border-radius:10px;padding:10px 12px;line-height:1.55;margin-top:10px}\n.explain b{color:var(--g)}\n.pm{border:1.5px solid var(--y);background:#fffbe0;border-radius:10px;padding:10px 12px;line-height:1.55;margin-top:10px}\n.pm b{color:#7a6600}\n.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0;font-size:13px}\n.ctl button{font:inherit;font-size:12px;padding:6px 11px;border:1.5px solid var(--g);background:#fff;color:var(--g);border-radius:8px;cursor:pointer}\n.ctl button.on{background:var(--g);color:#fff}\nselect{font:inherit;font-size:12px;padding:4px 6px;border:1.5px solid var(--g);border-radius:6px;color:var(--g);background:#fff}\ntable{border-collapse:collapse;width:100%;font-size:12.5px;margin-top:8px}th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--gr);vertical-align:top}th{font-size:11.5px;color:#555}\ntd.f{font-family:ui-monospace,Menlo,monospace;color:var(--g);white-space:nowrap}\ntr.sel{cursor:pointer}tr.sel:hover{background:#f4f9f8}tr.sel.on{background:#e3f1ef}\n.badge{display:inline-block;font-size:11px;border-radius:6px;padding:2px 8px;margin:1px 2px 1px 0}\n.b-g{background:var(--g);color:#fff}.b-y{background:var(--y);color:#222}.b-gr{background:var(--gr);color:#333}.b-pu{background:var(--pu);color:#fff}.b-am{background:var(--am);color:#fff}\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n.fig{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}\n@media(max-width:800px){.grid2,.fig{grid-template-columns:1fr}}\n.pane{display:none}.pane.on{display:block}\n.chip{display:inline-block;border:1.5px solid var(--g);color:var(--g);border-radius:14px;padding:2px 10px;font-size:12px;margin:2px 3px 2px 0}\n.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}\n.refs{font-size:12px;color:#555;line-height:1.6;margin-top:16px}.refs a{color:var(--g)}\n.mt{display:block;overflow-x:auto}\n<\/style><\/head><body><div class=\"wrap\">\n<div class=\"eyebrow\">Elementos móveis · plasmídeos<\/div>\n<h1>Plasmídeos: anatomia, hospedeiros e mobilidade<\/h1>\n<p class=\"lead\">Um plasmídeo é um replicon extracromossômico com duas partes: o <b>backbone<\/b> (o mínimo para existir e se manter) e o <b>acessório<\/b> (o que ele traz de vantagem). Quatro blocos: anatomia, hospedeiros, mobilidade e tipagem.<\/p>\n<div class=\"tabs\" id=\"tabs\"><\/div>\n\n<!-- 1 -->\n<div class=\"pane\" id=\"p0\">\n<div class=\"card\"><h3>Anatomia: clique em uma região<\/h3>\n<div class=\"ctl\" id=\"am\"><\/div>\n<div class=\"grid2\"><svg id=\"s0\" viewBox=\"0 0 520 365\"><\/svg><div><div id=\"a0\" class=\"explain\" style=\"margin-top:0\"><\/div><\/div><\/div>\n<\/div>\n<\/div>\n\n<!-- 2 -->\n<div class=\"pane\" id=\"p1\">\n<div class=\"card\"><h3>Espectro de hospedeiros: onde as linhagens se encontram na árvore<\/h3>\n<p style=\"margin:0 0 6px;line-height:1.55\">Clique nos gêneros onde o plasmídeo foi encontrado. O <b>ponto de convergência<\/b> (círculo verde) é o menor grupo taxonômico que reúne todos eles: quanto mais alto, mais amplo o espectro.<\/p>\n<div class=\"ctl\" id=\"hp\"><\/div>\n<svg id=\"s1\" viewBox=\"0 0 1000 350\"><\/svg>\n<div class=\"explain\" id=\"h1\"><\/div><\/div>\n<div class=\"grid2\">\n<div class=\"card\"><h3>Amplo ou estreito<\/h3><p style=\"line-height:1.6;margin:0\"><b>Amplo espectro (broad-host-range):<\/b> encontrados ou demonstrados replicando em gêneros bem diversos.<br><b>Estreito (narrow-host-range):<\/b> apenas em alguns hospedeiros.<\/p><\/div>\n<div class=\"card\"><h3>Suicidas<\/h3><p style=\"line-height:1.6;margin:0\">Plasmídeos de resistência transferidos para hospedeiros onde <b>não replicam<\/b> são comuns. Elementos como IS, Tn e In \"escapam\" para outro replicon funcional (cromossomo ou plasmídeo residente), então até plasmídeos de espectro estreito podem servir de vetores suicidas para a disseminação horizontal.<\/p><\/div><\/div>\n<\/div>\n\n<!-- 3 -->\n<div class=\"pane\" id=\"p2\">\n<div class=\"card\"><h3>Três tipos de plasmídeo quanto à mobilidade<\/h3>\n<div class=\"ctl\" id=\"mm\"><\/div>\n<svg id=\"s2\" viewBox=\"0 0 1000 290\"><\/svg>\n<div class=\"explain\" id=\"m2\"><\/div>\n<\/div>\n<\/div>\n\n<!-- 4 -->\n<div class=\"pane\" id=\"p4\">\n<div class=\"card\"><h3>Tipagem de mobilidade (MOB): clique em um plasmídeo<\/h3>\n<p style=\"margin:0 0 6px;line-height:1.55\">A tipagem junta o que o plasmídeo <b>tem de replicação<\/b> (Inc/rep) com o que ele <b>tem de transferência<\/b> (relaxase, MPF, oriT). É a base da previsão de mobilidade e ajuda a entender a epidemiologia: plasmídeos com o mesmo conjunto de marcadores e o mesmo cluster são candidatos a pertencer à mesma linhagem.<\/p>\n<table><tr><th>Cluster<\/th><th>Inc / rep<\/th><th>Relaxase<\/th><th>MPF<\/th><th>Mobilidade<\/th><\/tr><tbody id=\"tt\"><\/tbody><\/table>\n<div class=\"explain\" id=\"te\"><\/div><\/div>\n<div class=\"card\"><h3>Leitura epidemiológica (One Health)<\/h3>\n<table><tr><th>Campo<\/th><th>Para que serve ao comparar isolados clínicos e metagenomas<\/th><\/tr>\n<tr><td class=\"f\">Inc / rep<\/td><td>Rótulo de família do plasmídeo; permite contar famílias presentes em cada compartimento.<\/td><\/tr>\n<tr><td class=\"f\">Relaxase + MPF<\/td><td>Diz se o plasmídeo pode se espalhar sozinho, com ajuda, ou não.<\/td><\/tr>\n<tr><td class=\"f\">Cluster primário / secundário<\/td><td>Mesma sequência-base em amostras diferentes (distância Mash): permite perguntar se um plasmídeo do paciente é parente de um do ambiente.<\/td><\/tr>\n<tr><td class=\"f\">Faixa de hospedeiros<\/td><td>Estima o quanto o plasmídeo pode cruzar fronteiras entre espécies.<\/td><\/tr><\/table>\n<div class=\"pm\"><b>Cuidado:<\/b> parentesco de cluster não é prova de transferência, e em metagenomas os plasmídeos montam fragmentados. Compare por marcadores (Inc, relaxase, MPF) e cluster, e fale em \"candidato\", não em \"transmissão\".<\/div><\/div>\n<\/div>\n\n<div class=\"refs\">Referências completas na aba <b>Referências<\/b>.<\/div>\n<\/div>\n<script>\nconst $=id=>document.getElementById(id);\nconst TN=['Anatomia','Hospedeiros','Mobilidade','Tipagem MOB'];\n$('tabs').innerHTML=TN.map((t,i)=>`<button data-t=\"${i}\"><i>${i+1}<\/i>${t}<\/button>`).join('');\nfunction tab(i){document.querySelectorAll('.tabs button').forEach((b,k)=>b.classList.toggle('on',k===i));document.querySelectorAll('.pane').forEach((p,k)=>p.classList.toggle('on',k===i))}\n$('tabs').onclick=e=>{const b=e.target.closest('button');if(b)tab(+b.dataset.t)};\nconst G='#037972',Y='#f8e04d',PU='#6b5bb5',AM='#c58a1c';\n/* dados reais (mobtyper_results.txt, isolado 1) */\nconst R=[\n{cl:'AA405',n:29,sz:320772,rep:'IncFIB, IncHI1B',rel:'MOBH',mpf:'MPF_F',ori:'-',mob:'conjugative',nn:'K. pneumoniae',d:'0,0061',sec:'AI436',hr:'order',hn:'Enterobacterales'},\n{cl:'AA457',n:8,sz:99453,rep:'IncFIB',rel:'MOBF',mpf:'MPF_F',ori:'-',mob:'conjugative',nn:'K. pneumoniae',d:'0,0012',sec:'AI561',hr:'order',hn:'Enterobacterales'},\n{cl:'AA275',n:4,sz:72064,rep:'IncFII, rep_cluster_2183, rep_cluster_2350',rel:'MOBF',mpf:'-',ori:'MOB_unknown',mob:'mobilizable',nn:'K. pneumoniae',d:'0,032',sec:'-',hr:'multi-phylla',hn:'Actinomycetota, Bacillota, Bacteroidota, Pseudomonadota'},\n{cl:'AA833',n:1,sz:21291,rep:'-',rel:'-',mpf:'-',ori:'-',mob:'non-mobilizable',nn:'K. pneumoniae',d:'0,034',sec:'-',hr:'family',hn:'Enterobacteriaceae'},\n{cl:'AA944',n:1,sz:9857,rep:'ColRNAI_rep_cluster_1857',rel:'MOBC',mpf:'-',ori:'-',mob:'mobilizable',nn:'K. pneumoniae',d:'0,0001',sec:'AJ427',hr:'order',hn:'Enterobacterales'},\n{cl:'AC129',n:1,sz:6268,rep:'rep_cluster_1195',rel:'MOBP',mpf:'-',ori:'-',mob:'mobilizable',nn:'E. coli',d:'0,00005',sec:'AL194',hr:'class',hn:'Gammaproteobacteria'},\n{cl:'AA103',n:1,sz:4294,rep:'ColRNAI_rep_cluster_1987, rep_cluster_2373',rel:'-',mpf:'-',ori:'-',mob:'non-mobilizable',nn:'K. pneumoniae',d:'0,0017',sec:'AH720',hr:'genus',hn:'Klebsiella'},\n{cl:'AB040',n:1,sz:2495,rep:'rep_cluster_2335',rel:'-',mpf:'-',ori:'MOB_unknown',mob:'mobilizable , relaxase e, nos conjugativos, MPF e proteína de acoplamento. É o assunto da aba 3.'},\n {k:'is1',a:[140,152],c:PU,g:'a',t:'IS',d:'<b>IS (sequência de inserção).<\/b> Elemento móvel simples, só com o gene da transposase. Flanqueia outros genes e os move.'},\n {k:'tn',a:[154,206],c:AM,g:'a',t:'Tn',d:'<b>Transposon (Tn).<\/b> Carrega genes (aqui, resistência) entre extremidades que permitem a transposição. Pode \"pular\" para o cromossomo ou outro plasmídeo.'},\n {k:'arg',a:[216,246],c:Y,g:'a',t:'ARG',d:'<b>Gene de resistência (ARG).<\/b> O que faz o plasmídeo importante clinicamente. Costuma estar dentro de Tn ou integron.'},\n {k:'in',a:[248,282],c:'#d9b441',g:'a',t:'In',d:'<b>Integron (In).<\/b> Plataforma que captura cassetes gênicos (frequentemente de resistência) e os expressa em um promotor comum.'},\n {k:'is2',a:[286,298],c:PU,g:'a',t:'IS',d:'<b>IS<\/b> de novo: várias cópias de IS no mesmo plasmídeo criam repetições e podem rearranjá-lo.'},\n {k:'met',a:[308,350],c:'#f1e9a3',g:'a',t:'metabolismo',d:'<b>Genes de metabolismo específico.<\/b> Por exemplo, utilização de uma fonte de carbono, metais ou virulência: vantagem em um nicho.'}];\nlet AF='all',AS='ori';\nfunction arc(cx,cy,r,a0,a1,w){const p=(a,rr)=>{const t=(a-90)*Math.PI/180;return[cx+rr*Math.cos(t),cy+rr*Math.sin(t)]};const[a,b]=p(a0,r+w/2),[c,d]=p(a1,r+w/2),[e,f]=p(a1,r-w/2),[g,h]=p(a0,r-w/2);const big=a1-a0>180?1:0;return`M${a} ${b}A${r+w/2} ${r+w/2} 0 ${big} 1 ${c} ${d}L${e} ${f}A${r-w/2} ${r-w/2} 0 ${big} 0 ${g} ${h}Z`}\nfunction d0(){\n $('am').innerHTML=[['all','tudo'],['b','só backbone'],['a','só acessório']].map(([k,t])=>`<button class=\"${AF===k?'on':''}\" data-f=\"${k}\">${t}<\/button>`).join('');\n let o=`<circle cx=\"260\" cy=\"170\" r=\"108\" fill=\"none\" stroke=\"#ebebeb\" stroke-width=\"2\"/><text x=\"260\" y=\"166\" font-size=\"13\" text-anchor=\"middle\" fill=\"#037972\" font-weight=\"700\">plasmídeo<\/text><text x=\"260\" y=\"184\" font-size=\"10\" text-anchor=\"middle\" fill=\"#66 f(!n.c.length){n.y=24+leafN*32;leafN++}else{n.c.forEach(lay);n.y=(n.c[0].y+n.c[n.c.length-1].y)/2}n.x=RK[n.r][1]})(TX);\nlet HS=new Set(['Salmonella','Escherichia','Citrobacter','Cronobacter','Klebsiella']);\nfunction leaves(n){return n.c.length?n.c.flatMap(leaves):[n.n]}\nfunction lca(n){const s=[...HS];for(const c of n.c){const L=leaves(c);if(s.every(x=>L.includes(x)))return lca(c)}return n}\nconst PRE={'Exemplo (5 gêneros)':['Salmonella','Escherichia','Citrobacter','Cronobacter','Klebsiella'],'1 gênero':['Klebsiella'],'Mesma ordem':['Klebsiella','Yersinia'],'Mesma classe':['Klebsiella','Pseudomonas'],'Vários filos':['Klebsiella','Pseudomonas','Staphylococcus']};\nfunction d1(){\n $('hp').innerHTML=Object.keys(PRE).map(k=>`<button data-p=\"${k}\">${k}<\/button>`).join('');\n const L=HS.size?lca(TX):null,inSel=n=>leaves(n).some(x=>HS.has(x));let o='';\n const edge=(n,sel)=>{if(!n.c.length)return;const ys=n.c.map(c=>c.y);\n  n.c.forEach(c=>{const on=sel&&inSel(c);o+=`<path d=\"M${n.x} ${n.y}L${c.x-0} ${n.y}M${c.x} ${n.y}\" stroke=\"none\"/>`;o+=`<path d=\"M${n.x} ${n.y}V${c.y}H${c.x}\" fill=\"none\" stroke=\"${on?G:'#bbb'}\" stroke-width=\"${on?3:1.5}\"/>`;edge(c,sel)})};\n edge(TX,true);\n const nodes=[];(function w(n){nodes.push(n);n.c.forEach(w)})(TX);\n nodes.forEach(n=>{if(n.c.length&&n.r!=='genus'){o+=`<text x=\"${n.x+6}\" y=\"${n.y-7}\" font-size=\"9\" fill=\"#777\">${n.n}<\/text>`}});\n nodes.filter(n=>!n.c.length).forEach(n=>{const on=HS.has(n.n);\n  o+=`<g class=\"lf\" data-n=\"${n.n}\" style=\"cursor:pointer\"><circle cx=\"${n.x}\" cy=\"${n.y}\" r=\"6\" fill=\"${on?G:'#fff'}\" stroke=\"${on?G:'#999'}\" stroke-width=\"2\"/><text x=\"${n.x+14}\" y=\"${n.y+4}\" font-size=\"13\" font-style=\"italic\" fill=\"${on?'#222':'#999'}\" font-weight=\"${on?700:400}\">${n.n}<\/text><\/g>`});\n if(L){o+=`<circle cx=\"${L.x}\" cy=\"${L.y}\" r=\"10\" fill=\"#fff\" stroke=\"#6cc24a\" stroke-width=\"5\"/><circle cx=\"${L.x}\" cy=\"${L.y}\" r=\"10\" fill=\"none\" stroke=\"#222\" stroke-width=\"1\" stroke-dasharray=\"0\"/><line x1=\"${L.x-10}\" x2=\"${L.x+10}\" y1=\"${L.y}\" y2=\"${L.y}\" stroke=\"#222\" stroke-width=\"2\"/>`}\n o+=`<g font-size=\"10\" fill=\"#555\">`+Object.values(RK).map(([t,x])=>`<text x=\"${x}\" y=\"345\" text-anchor=\"middle\">${t}<\/text>`).join('')+`<\/g>`;\n $('s1').innerHTML=o;\n if(!L){$('h1').innerHTML='Selecione ao menos um gênero.';return}\n const isLeaf=!L.c.length,rk=RK[L.r][0];\n const wide=L.r==='domain'?' (no MOB-suite: <b>multi-phylla<\/b>)':'';\n $('h1').innerHTML=`<div style=\"background:#f3f3f3;border-radius:8px;padding:8px 12px;display:inline-block;line-height:1.7\"><u>Rank de convergência<\/u>: <b>${rk}<\/b>${wide}<br><u>Táxon de convergência<\/u>: <b><i>${L.n}<\/i><\/b><\/div><br><span style=\"display:block;margin-top:8px\">`+(['genus','family'].includes(L.r)?'Espectro <b>estreito<\/b>: os hospedeiros são aparentados.':['order','class'].includes(L.r)?'Espectro <b>intermediário<\/b>: cruza famílias ou ordens.':'Espectro <b>amplo<\/b>: cruza filos diferentes.')+'<\/span>';\n}\n$('hp').onclick=e=>{const b=e.target.closest('button');if(b){HS=new Set(PRE[b.dataset.p]);d1()}};\n$('s1').onclick=e=>{const g=e.target.closest('.lf');if(g){const n=g.dataset.n;HS.has(n)?HS.delete(n):HS.add(n);d1()}};\n/* ---- 3 mobilidade ---- */\nlet MM='conj';\nconst MMD={conj:'Conjugativo (autotransmissível)',mob:'Mobilizável',non:'Não mobilizável'};\nfunction d2(){\n $('mm').innerHTML=Object.keys(MMD).map(k=>`<button class=\"${MM===k?'on':''}\" data-m=\"${k}\">${MMD[k]}<\/button>`).join('');\n const hasRel=MM!=='non',hasMPF=MM==='conj';\n let o=`<rect x=\"20\" y=\"20\" width=\"450\" height=\"250\" rx=\"70\" fill=\"#fff\" stroke=\"#bbb\" stroke-width=\"2\"/><text x=\"245\" y=\"14\" font-size=\"10\" text-anchor=\"middle\" fill=\"#666\">célula doadora<\/text>`;\n o+=`<rect x=\"540\" y=\"20\" width=\"440\" height=\"250\" rx=\"70\" fill=\"#fff\" stroke=\"#bbb\" stroke-width=\"2\"/><text x=\"760\" y=\"14\" font-size=\"10\" text-anchor=\"middle\" fill=\"#666\">célula receptora<\/text>`;\n const py=MM==='mob'?100:140;\n o+=`<circle cx=\"120\" cy=\"${py}\" r=\"48\" fill=\"#fff\" stroke=\"${G}\" stroke-width=\"3\"/><text x=\"120\" y=\"${py+4}\" font-size=\"10\" text-anchor=\"middle\" fill=\"${G}\" font-weight=\"700\">plasmídeo<\/text>`;\n // relaxossomo\n const rx=172,ry=py;\n o+=hasRel?`<circle cx=\"${rx}\" cy=\"${ry}\" r=\"15\" fill=\"${G}\"/><text x=\"${rx}\" y=\"${ry-22}\" font-size=\"9\" text-anchor=\"middle\" fill=\"${G}\">relaxossomo<\/text><text x=\"${rx}\" y=\"${ry+3}\" font-size=\"8\" text-anchor=\"middle\" fill=\"#fff\">rlx+oriT<\/text>`:`<circle cx=\"${rx}\" cy=\"${ry}\" r=\"15\" fill=\"#fff\" stroke=\"#bbb\" stroke-dasharray=\"3 3\"/><text x=\"${rx}\" y=\"${ry+3}\" font-size=\"8\" text-anchor=\"middle\" fill=\"#999\">sem<\/text><text x=\"${rx}\" y=\"${ry-22}\" font-size=\"9\" text-anchor=\"middle\" fill=\"#999\">relaxossomo ausente<\/text>`;\n // helper plasmid in mobilizable\n if(MM==='mob'){o+=`<circle cx=\"120\" cy=\"222\" r=\"36\" fill=\"#fff\" stroke=\"${AM}\" stroke-width=\"3\"/><text x=\"120\" y=\"219\" font-size=\"9\" text-anchor=\"middle\" fill=\"${AM}\" font-weight=\"700\">conjugativo<\/text><text x=\"120\" y=\"231\" font-size=\"9\" text-anchor=\"middle\" fill=\"${AM}\">(ajudante)<\/text>`}\n // T4CP e MPF\n const hy=MM==='mob'?150:140;\n if(MM==='conj'){o+=`<line x1=\"${rx+15}\" y1=\"${ry}\" x2=\"290\" y2=\"${hy}\" stroke=\"${PU}\" stroke-width=\"2\"/><line x1=\"340\" y1=\"${hy}\" x2=\"410\" y2=\"${hy}\" stroke=\"${PU}\" stroke-width=\"2\"/>`}\n if(MM==='mob'){o+=`<line x1=\"${rx+11}\" y1=\"${ry+11}\" x2=\"290\" y2=\"${hy}\" stroke=\"${PU}\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><line x1=\"156\" y1=\"222\" x2=\"290\" y2=\"${hy+14}\" stroke=\"${PU}\" stroke-width=\"2\"/><line x1=\"340\" y1=\"${hy}\" x2=\"410\" y2=\"${hy}\" stroke=\"${PU}\" stroke-width=\"2\"/>`}\n if(hasRel&&MM!=='non'){o+=`<rect x=\"290\" y=\"${hy-12}\" width=\"50\" height=\"24\" rx=\"5\" fill=\"${PU}\"/><text x=\"315\" y=\"${hy+3}\" font-size=\"9\" text-anchor=\"middle\" fill=\"#fff\">T4CP<\/text>`}\n else{o+=`<rect x=\"290\" y=\"${hy-12}\" width=\"50\" height=\"24\" rx=\"5\" fill=\"#fff\" stroke=\"#bbb\" stroke-dasharray=\"3 3\"/><text x=\"315\" y=\"${hy+3}\" font-size=\"9\" text-anchor=\"middle\" fill=\"#999\">sem T4CP<\/text>`}\n const mpfHere=MM==='conj'||MM==='mob';\n if(mpfHere){o+=`<rect x=\"410\" y=\"${hy-42}\" width=\"50\" height=\"84\" rx=\"8\" fill=\"${Y}\" stroke=\"#bba\"/><text x=\"435\" y=\"${hy+3}\" font-size=\"9\" text-anchor=\"middle\" fill=\"#222\">MPF<\/text><rect x=\"460\" y=\"${hy-10}\" width=\"120\" height=\"20\" rx=\"10\" fill=\"${Y}\" stroke=\"#bba\"/><text x=\"520\" y=\"${hy-16}\" font-size=\"9\" text-anchor=\"middle\" fill=\"#7a6600\">pilus / poro T4SS<\/text>`}\n else{o+=`<rect x=\"410\" y=\"${hy-42}\" width=\"50\" height=\"84\" rx=\"8\" fill=\"#fff\" stroke=\"#bbb\" stroke-dasharray=\"3 3\"/><text x=\"435\" y=\"${hy+3}\" font-size=\"9\" text-anchor=\"middle\" fill=\"#999\">sem MPF<\/text>`}\n // transferência\n if(MM!=='non'){o+=`<path d=\"M470 ${hy+36}C 560 ${hy+60} 640 ${hy+60} 720 ${hy+30}\" fill=\"none\" stroke=\"${G}\" stroke-width=\"3\" stroke-dasharray=\"7 5\"/><circle cx=\"780\" cy=\"${hy+20}\" r=\"30\" fill=\"#fff\" stroke=\"${G}\" stroke-width=\"3\" stroke-dasharray=\"4 3\"/><text x=\"780\" y=\"${hy+24}\" font-size=\"9\" text-anchor=\"middle\" fill=\"${G}\">DNA<\/text><text x=\"780\" y=\"${hy+66}\" font-size=\"10\" text-anchor=\"middle\" fill=\"${G}\">transferido<\/text>`}\n else{o+=`<text x=\"760\" y=\"150\" font-size=\"13\" text-anchor=\"middle\" fill=\"#999\">não se transfere por conjugação<\/text>`}\n // legenda\n o+=`<rect x=\"640\" y=\"228\" width=\"12\" height=\"12\" fill=\"${G}\"/><text x=\"658\" y=\"238\" font-size=\"9\" fill=\"#333\">relaxossomo<\/text><rect x=\"730\" y=\"228\" width=\"12\" height=\"12\" fill=\"${PU}\"/><text x=\"748\" y=\"238\" font-size=\"9\" fill=\"#333\">T4CP (ATPase)<\/text><rect x=\"830\" y=\"228\" width=\"12\" height=\"12\" fill=\"${Y}\" stroke=\"#bba\"/><text x=\"848\" y=\"238\" font-size=\"9\" fill=\"#333\">MPF (transferossomo)<\/text>`;\n $('s2').innerHTML=o;\n $('m2').innerHTML={\n conj:`<b>Conjugativo (autotransmissível).<\/b> A região de transferência (<i>tra<\/i>) codifica o <b>MPF<\/b>, um sistema de secreção tipo IV (T4SS) que forma o <b>pilus conjugativo<\/b> (descrito em 8 tipos), e as proteínas de <b>transferência e replicação do DNA (DTR)<\/b>, como a <b>relaxase<\/b>, que se liga ao oriT e corta a fita para exportá-la. A <b>proteína de acoplamento (T4CP, uma ATPase)<\/b> liga o <b>relaxossomo<\/b> (DTR + oriT) ao <b>transferossomo<\/b> (núcleo do MPF).`,\n mob:`<b>Mobilizável.<\/b> Tem apenas o <b>relaxossomo<\/b> (relaxase + oriT), sem MPF próprio. Para se transferir, <b>usa o MPF de outro plasmídeo conjugativo<\/b> que esteja na mesma célula.`,\n non:`<b>Não mobilizável.<\/b> Sem relaxase, sem oriT e sem MPF: não tem como iniciar nem concluir a conjugação. Atenção: em montagens fragmentadas, o módulo pode estar em outro contig, então \"não mobilizável\" também pode significar \"incompleto\".`}[MM];\n}\n$('mm').onclick=e=>{const b=e.target.closest('button');if(b){MM=b.dataset.m;d2()}};\n/* ---- 5 tipagem ---- */\nlet TS=0;\nfunction d4(){\n $('tt').innerHTML=R.map((r,i)=>`<tr class=\"sel ${i===TS?'on':''}\" data-i=\"${i}\"><td class=\"f\">${r.cl}<\/td><td>${r.rep}<\/td><td>${r.rel}<\/td><td>${r.mpf}<\/td><td><span class=\"badge ${mb(r.mob)}\">${r.mob}<\/span><\/td><\/tr>`).join('');\n const r=R[TS];const t=[];\n t.push(`<b>${r.cl}<\/b> · ${r.n} contig${r.n>1?'s':''}, ${r.sz.toLocaleString('pt-BR')} pb. Vizinho Mash mais próximo: <i>${r.nn}<\/i> (distância ${r.d}); cluster secundário ${r.sec}.`);\n t.push(r.rep==='-'?'<b>Sem replicon detectado:<\/b> a classificação como plasmídeo veio de parentesco (Mash) com plasmídeos do banco.':`<b>Replicon:<\/b> ${r.rep}.`+(r.rep.includes(',')?' Mais de um replicon no mesmo cluster: pode ser um plasmídeo multi-replicon ou uma montagem que juntou duas moléculas.':''));\n t.push(r.mob==='conjugative'?`<b>Conjugativo:<\/b> relaxase ${r.rel} + MPF ${r.mpf}.`:r.mob==='mobilizable'?`<b>Mobilizável:<\/b> ${r.rel!=='-'?'relaxase '+r.rel:'oriT '+r.ori}, mas <b>sem MPF<\/b>: depende de um conjugativo na mesma célula (como AA405 ou AA457 neste isolado).`:`<b>Não mobilizável:<\/b> nenhum marcador de relaxase, MPF ou oriT foi encontrado.`);\n t.push(`<b>Faixa de hospedeiros prevista:<\/b> ${r.hr} (${r.hn}).`);\n if(r.n>1)t.push(`<span style=\"color:#7a6600\">Reconstruído de ${r.n} contigs: tratar como hipótese.<\/span>`);\n $('te').innerHTML=t.join('<br>');\n}\n$('tt').onclick=e=>{const tr=e.target.closest('tr.sel');if(tr){TS=+tr.dataset.i;d4()}};\nd0();d1();d2();d4();tab(0);\n<\/script><\/body><\/html>\n"}, {"t": "MOB-suite", "h": "<!doctype html>\n<html lang=\"pt-BR\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>MOB-suite: classificação de plasmídeos<\/title>\n<style>\n:root{--g:#037972;--y:#f8e04d;--gr:#ebebeb;--tx:#222;--pu:#6b5bb5;--rd:#d6452f}\n*{box-sizing:border-box}\nbody{margin:0;background:#fff;color:var(--tx);font-family:\"Verdana Pro\",Verdana,\"DejaVu Sans\",sans-serif;font-size:14px}\n.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 40px}\n.eyebrow{font:11px ui-monospace,Menlo,monospace;letter-spacing:.12em;color:#555;text-transform:uppercase}\nh1{margin:6px 0 6px;font-size:26px;color:var(--g)}\np.lead{margin:0 0 14px;max-width:840px;line-height:1.5;color:#444}\n.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}\n.tabs button{font:inherit;font-size:12.5px;padding:8px 13px;border:1.5px solid var(--g);background:#fff;color:var(--g);border-radius:8px;cursor:pointer}\n.tabs button i{font-style:normal;font-weight:700;margin-right:5px}\n.tabs button.on{background:var(--g);color:#fff}\n.card{border:1.5px solid var(--gr);border-radius:12px;padding:12px 14px;background:#fff;margin-bottom:14px}\n.card h3{margin:0 0 8px;font-size:14px;color:var(--g)}\nsvg{display:block;width:100%;height:auto}\nsvg text{font-family:ui-monospace,Menlo,monospace}\n.explain{border:1.5px dashed var(--g);background:#f4f9f8;border-radius:10px;padding:10px 12px;line-height:1.55;margin-top:10px}\n.explain b{color:var(--g)}\n.pm{border:1.5px solid var(--y);background:#fffbe0;border-radius:10px;padding:10px 12px;line-height:1.55;margin-top:10px}\n.pm b{color:#7a6600}\n.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0;font-size:13px}\n.ctl button,.chip{font:inherit;font-size:12px;padding:6px 11px;border:1.5px solid var(--g);background:#fff;color:var(--g);border-radius:8px;cursor:pointer}\n.ctl button.on,.chip.on{background:var(--g);color:#fff}\nselect{font:inherit;font-size:12px;padding:4px 6px;border:1.5px solid var(--g);border-radius:6px;color:var(--g);background:#fff}\n.cmd{background:#1f2a29;color:#e8f3f1;border-radius:10px;padding:12px 14px;font:12.5px/1.8 ui-monospace,Menlo,monospace;overflow-x:auto;white-space:pre}\n.cmd .c{color:#7fb8b2}.cmd .f{color:var(--y)}\n.badge{display:inline-block;font-size:11px;border-radius:6px;padding:2px 8px;margin:1px 2px 1px 0}\n.b-g{background:var(--g);color:#fff}.b-y{background:var(--y);color:#222}.b-gr{background:var(--gr);color:#333}.b-pu{background:var(--pu);color:#fff}\ntable{border-collapse:collapse;width:100%;font-size:12.5px;margin-top:8px}th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--gr);vertical-align:top}th{font-size:11.5px;color:#555}\ntd.f{font-family:ui-monospace,Menlo,monospace;color:var(--g);white-space:nowrap}\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n@media(max-width:760px){.grid2{grid-template-columns:1fr}}\n.refs{font-size:12px;color:#555;line-height:1.6;margin-top:16px}.refs a{color:var(--g)}\n.sel{cursor:pointer}\n@media(max-width:760px){#og{grid-template-columns:1fr!important}}\n.mt td,.mt th{font-size:11.5px;padding:4px 7px}.mt{overflow-x:auto;display:block}\n.pane{display:none}.pane.on{display:block}\n<\/style><\/head><body><div class=\"wrap\">\n<div class=\"eyebrow\">Elementos móveis · MOB-suite<\/div>\n<h1>Como o MOB-suite classifica plasmídeos<\/h1>\n<p class=\"lead\">O MOB-suite separa os contigs de uma montagem em <b>cromossomo<\/b> e <b>plasmídeos<\/b> e diz, para cada plasmídeo, <b>de que tipo ele é<\/b>, <b>se consegue se mover<\/b> e <b>com quem é parente<\/b>. Três blocos: a lógica, a mobilidade e os comandos. A anatomia, os hospedeiros e a biologia da mobilidade do plasmídeo estão na aba <b>Plasmídeos<\/b>.<\/p>\n<div class=\"tabs\" id=\"tabs\"><\/div>\n\n<!-- 1 -->\n<div class=\"pane\" id=\"p0\">\n<div class=\"card\"><h3>Clique em um contig para ver as evidências<\/h3>\n<svg id=\"s0\" viewBox=\"0 0 1000 250\"><\/svg>\n<div class=\"explain\" id=\"e0\"><\/div>\n<\/div>\n<div class=\"card\"><h3>Como fica a saída do <span style=\"font-family:ui-monospace,Menlo,monospace\">mob_recon<\/span> (exemplo real)<\/h3>\n<div class=\"ctl\" id=\"ob\" style=\"margin-top:0\"><\/div><div id=\"op\"><\/div><\/div>\n<\/div>\n\n<!-- 2 -->\n<div class=\"pane\" id=\"p1\">\n<div class=\"card\"><h3>Marque o que o plasmídeo carrega<\/h3>\n<div class=\"ctl\" id=\"mc\"><\/div>\n<svg id=\"s1\" viewBox=\"0 0 1000 250\"><\/svg>\n<div class=\"explain\" id=\"e1\"><\/div>\n<\/div>\n<div class=\"card\"><h3>As quatro peças <span style=\"font-weight:400;font-size:12px;color:#666\">(a base biológica está na aba Plasmídeos)<\/span><\/h3>\n<table><tr><th>Peça<\/th><th>Função<\/th><th>Papel na transferência<\/th><\/tr>\n<tr><td class=\"f\">rep<\/td><td>Origem e controle de replicação. Define o grupo Inc.<\/td><td>Não move o plasmídeo; ele só se mantém na célula.<\/td><\/tr>\n<tr><td class=\"f\">oriT<\/td><td>Ponto onde o DNA é cortado para ser transferido.<\/td><td>Marca o que pode ser transferido.<\/td><\/tr>\n<tr><td class=\"f\">relaxase (MOB)<\/td><td>Reconhece o oriT e corta a fita.<\/td><td>Inicia a transferência. Tem famílias (MOBF, MOBP, MOBQ…).<\/td><\/tr>\n<tr><td class=\"f\">MPF<\/td><td>Sistema de pareamento (o \"canal\" de conjugação).<\/td><td>Sem ele, o plasmídeo depende do MPF de outro plasmídeo.<\/td><\/tr><\/table>\n<\/div>\n<\/div>\n\n<!-- 4 -->\n<div class=\"pane\" id=\"p3\">\n<div class=\"card\"><h3>Os 3 comandos principais<\/h3>\n<div class=\"ctl\" id=\"cb\"><\/div>\n<div class=\"cmd\" id=\"cm\"><\/div>\n<div class=\"explain\" id=\"ce\"><\/div>\n<\/div>\n<div class=\"card\"><h3>Como ler a saída do <span style=\"font-family:ui-monospace,Menlo,monospace\">mob_recon<\/span><\/h3>\n<table><tr><th>Arquivo<\/th><th>O que tem<\/th><\/tr>\n<tr><td class=\"f\">biomarkers.blast.txt<\/td><td>Resultado bruto do BLAST dos marcadores (rep, relaxase, MPF, oriT) contra os contigs: a evidência por trás da tipagem.<\/td><\/tr>\n<tr><td class=\"f\">mge.report.txt<\/td><td>Elementos móveis encontrados nos contigs (sequências de inserção, entre outros), com posição e identidade.<\/td><\/tr>\n<tr><td class=\"f\">chromosome.fasta<\/td><td>Contigs classificados como cromossomo.<\/td><\/tr>\n<tr><td class=\"f\">plasmid_*.fasta<\/td><td>Um arquivo por plasmídeo reconstruído (grupo de contigs).<\/td><\/tr>\n<tr><td class=\"f\">contig_report.txt<\/td><td>Uma linha por contig: cromossomo ou plasmídeo, qual grupo, tamanho, marcadores, circularidade.<\/td><\/tr>\n<tr><td class=\"f\">mobtyper_results.txt<\/td><td>Uma linha por plasmídeo: <b>Inc (rep)<\/b>, relaxase, MPF, oriT, <b>mobilidade prevista<\/b>, cluster.<\/td><\/tr><\/table>\n<div class=\"pm\">Os nomes das colunas podem variar entre versões do MOB-suite.<\/div>\n<\/div>\n<\/div>\n\n<div class=\"refs\">Referências completas na aba <b>Referências<\/b>.<\/div>\n<\/div>\n<script>\nconst $=id=>document.getElementById(id);\nconst TN=['Como classifica','Mobilidade','Comandos'];\n$('tabs').innerHTML=TN.map((t,i)=>`<button data-t=\"${i}\"><i>${i+1}<\/i>${t}<\/button>`).join('');\nfunction tab(i){document.querySelectorAll('.tabs button').forEach((b,k)=>b.classList.toggle('on',k===i));document.querySelectorAll('.pane').forEach((p,k)=>p.classList.toggle('on',k===i))}\n$('tabs').onclick=e=>{const b=e.target.closest('button');if(b)tab(+b.dataset.t)};\nconst G='#037972',Y='#f8e04d',PU='#6b5bb5',GR='#ebebeb';\n\n/* ---------- 1: contigs ---------- */\nconst CT=[\n {id:'NODE_1',len:2900,m:[],mash:'—',cl:'chromosome',txt:'Sem marcadores de plasmídeo e sem parentesco com plasmídeos do banco. Fica como <b>cromossomo<\/b>. Contig grande e com cobertura típica de cópia única.'},\n {id:'NODE_2',len:1500,m:[],mash:'—',cl:'chromosome',txt:'Sem evidência de plasmídeo: <b>cromossomo<\/b>.'},\n {id:'NODE_3',len:260,m:['rep IncFII','relaxase MOBF','MPF_F'],mash:'AA123',cl:'p1',txt:'Carrega <b>rep (IncFII)<\/b>, relaxase e MPF, e é parecido com o grupo <b>AA123<\/b> do banco. Vira o núcleo do <b>plasmídeo 1<\/b>, que será classificado como <b>conjugativo<\/b>.'},\n {id:'NODE_7',len:110,m:[],mash:'AA123',cl:'p1',txt:'<b>Nenhum marcador<\/b>, então só pela sequência o contig não seria reconhecido. Mas ele é muito similar ao grupo <b>AA123<\/b>, o mesmo do NODE_3: entra no <b>plasmídeo 1<\/b>. É assim que o Mash recupera pedaços sem marcador.'},\n {id:'NODE_5',len:80,m:['rep IncR'],mash:'AA456',cl:'p2',txt:'Carrega <b>rep (IncR)<\/b> e pertence ao grupo <b>AA456<\/b>. Forma o <b>plasmídeo 2<\/b>, sem relaxase nem MPF nesta montagem: <b>não mobilizável<\/b> (pelo que se vê).'},\n {id:'NODE_9',len:30,m:['rep ColRNAI','relaxase MOBP'],mash:'AA789',cl:'p3',txt:'Pequeno, com <b>rep (ColRNAI)<\/b> e relaxase MOBP, sem MPF: <b>mobilizável<\/b>, ou seja, precisa do MPF de um plasmídeo conjugativo na mesma célula.'}];\nlet sel=0;\nfunction d0(){\n let o='',x=20;const sc=0.31;\n const col={chromosome:'#cfd8d7',p1:G,p2:PU,p3:'#c58a1c'};\n CT.forEach((c,i)=>{\n  const w=70+c.len*0.06;\n  o+=`<g class=\"sel\" data-i=\"${i}\"><rect x=\"${x}\" y=\"40\" width=\"${w}\" height=\"52\" rx=\"8\" fill=\"${col[c.cl]}\" ${i===sel?'stroke=\"#222\" stroke-width=\"3\"':'stroke=\"#fff\"'}/>`+\n     `<text x=\"${x+6}\" y=\"62\" font-size=\"10\" fill=\"${c.cl==='chromosome'?'#333':'#fff'}\">${c.id}<\/text><text x=\"${x+6}\" y=\"80\" font-size=\"9\" fill=\"${c.cl==='chromosome'?'#555':'#fff'}\">${c.len} kb<\/text><\/g>`;\n  c.m.forEach((m,k)=>{o+=`<rect x=\"${x+2}\" y=\"${98+k*17}\" width=\"${Math.max(w-4,96)}\" height=\"14\" rx=\"4\" fill=\"${Y}\"/><text x=\"${x+6}\" y=\"${109+k*17}\" font-size=\"9\" fill=\"#222\">${m}<\/text>`});\n  if(!c.m.length)o+=`<text x=\"${x+2}\" y=\"109\" font-size=\"9\" fill=\"#999\">sem marcador<\/text>`;\n  o+=`<text x=\"${x+2}\" y=\"162\" font-size=\"9\" fill=\"#555\">Mash: ${c.mash}<\/text>`;\n  c.x=x;c.w=w;x+=Math.max(w,96)+10;\n });\n o+=`<text x=\"20\" y=\"24\" font-size=\"11\" fill=\"#555\">contigs da montagem (largura aproximada ao tamanho)<\/text>`;\n // bins\n const bins=[['Cromossomo','chromosome',col.chromosome],['Plasmídeo 1 (AA123)','p1',col.p1],['Plasmídeo 2 (AA456)','p2',col.p2],['Plasmídeo 3 (AA789)','p3',col.p3]];\n let bx=20;o+=`<text x=\"20\" y=\"196\" font-size=\"11\" fill=\"#555\">saída do mob_recon<\/text>`;\n bins.forEach(([n,k,c])=>{const ids=CT.filter(t=>t.cl===k).map(t=>t.id.replace('NODE_','')).join('+');\n  o+=`<rect x=\"${bx}\" y=\"206\" width=\"225\" height=\"32\" rx=\"8\" fill=\"${c}\"/><text x=\"${bx+8}\" y=\"226\" font-size=\"10.5\" fill=\"${k==='chromosome'?'#333':'#fff'}\">${n}: ${ids}<\/text>`;bx+=240});\n $('s0').innerHTML=o;\n const c=CT[sel];$('e0').innerHTML=`<b>${c.id}<\/b> · ${c.txt}`;\n}\n$('s0').onclick=e=>{const g=e.target.closest('.sel');if(g){sel=+g.dataset.i;d0()}};\n\n/* ---------- 2: mobilidade ---------- */\nconst M={rep:true,rel:true,mpf:true,ori:true};\nconst ML={rep:'rep (replicon)',rel:'relaxase',mpf:'MPF',ori:'oriT'};\nfunction d1(){\n $('mc').innerHTML=Object.keys(M).map(k=>`<button class=\"${M[k]?'on':''}\" data-k=\"${k}\">${ML[k]}<\/button>`).join('');\n let cls,c,t;\n if(M.rel&&M.mpf){cls='CONJUGATIVO';c=G;t='Tem relaxase <b>e<\/b> MPF: faz o ciclo completo sozinho. Pode passar para outras células por conjugação e ainda ajudar outros plasmídeos.'}\n else if(M.rel||M.ori){cls='MOBILIZÁVEL';c='#c58a1c';t='Tem relaxase ou oriT, mas <b>não tem MPF<\/b>: pode ser transferido <b>se<\/b> houver um plasmídeo conjugativo na mesma célula fornecendo o MPF.'}\n else{cls='NÃO MOBILIZÁVEL';c='#999';t='Sem relaxase, sem oriT e sem MPF: não há como iniciar a transferência. Isso é o que se observa na montagem; um módulo que caiu em outro contig não aparece (veja o aviso abaixo).'}\n let o=`<rect x=\"20\" y=\"40\" width=\"960\" height=\"60\" rx=\"30\" fill=\"${GR}\"/>`;\n const parts=[['rep','#6b5bb5',60],['ori','#c58a1c',250],['rel',G,400],['mpf','#f8e04d',640]];\n parts.forEach(([k,cc,x])=>{const w=k==='mpf'?240:k==='rel'?170:110;\n  o+=`<rect x=\"${x}\" y=\"52\" width=\"${w}\" height=\"36\" rx=\"8\" fill=\"${M[k]?cc:'#fff'}\" stroke=\"${cc}\" stroke-dasharray=\"${M[k]?'':'4 3'}\" opacity=\"${M[k]?1:.6}\"/><text x=\"${x+8}\" y=\"75\" font-size=\"11\" fill=\"${M[k]&&k!=='mpf'?'#fff':'#222'}\">${ML[k]}${M[k]?'':' (ausente)'}<\/text>`});\n o+=`<text x=\"500\" y=\"25\" font-size=\"11\" fill=\"#555\" text-anchor=\"middle\">plasmídeo (representação linear)<\/text>`;\n o+=`<rect x=\"20\" y=\"130\" width=\"440\" height=\"70\" rx=\"12\" fill=\"${c}\"/><text x=\"40\" y=\"160\" font-size=\"14\" font-weight=\"700\" fill=\"#fff\">${cls}<\/text><text x=\"40\" y=\"182\" font-size=\"11\" fill=\"#fff\">predicted_mobility<\/text>`;\n o+=`<text x=\"490\" y=\"150\" font-size=\"11\" fill=\"#555\">${M.rep?'Inc: tipo de rep detectado.':'Sem rep: sem tipo Inc para este contig.'}<\/text>`;\n $('s1').innerHTML=o;\n $('e1').innerHTML=t+`<br><span style=\"color:#666;font-size:12px\">Aviso: com montagens fragmentadas, o MOB-suite só vê o que está nos contigs. Um plasmídeo \"não mobilizável\" pode estar apenas incompleto.<\/span>`;\n}\n$('mc').onclick=e=>{const b=e.target.closest('button');if(b){M[b.dataset.k]=!M[b.dataset.k];d1()}};\n\n/* ---------- 4: comandos ---------- */\nconst CM=[\n ['mob_init',`<span class=\"c\"># uma vez, ao instalar: baixa os bancos de dados<\/span>\nconda activate mob_suite\nmob_init`,'Baixa e prepara os bancos que o MOB-suite usa: sequências de <b>replicon<\/b>, <b>relaxase<\/b>, <b>MPF<\/b> e <b>oriT<\/b>, e os plasmídeos completos usados pelo <b>Mash<\/b> para os clusters. Sem isso os outros comandos não rodam. Só se faz uma vez (ou para atualizar).'],\n ['mob_recon',`conda activate mob_suite\nmob_recon <span class=\"f\">--infile<\/span> meu_genoma.fna <span class=\"f\">--outdir<\/span> saida_mob <span class=\"f\">--num_threads<\/span> 2 <span class=\"f\">--run_overhang<\/span>`,'O comando principal. Recebe o <b>genoma montado<\/b> (todos os contigs) e devolve o cromossomo e cada plasmídeo reconstruído, com a tipagem. <span style=\"font-family:ui-monospace,Menlo,monospace\">--run_overhang<\/span> marca como circular o contig cujas pontas se sobrepõem.'],\n ['mob_typer',`mob_typer <span class=\"f\">--infile<\/span> plasmideo.fasta <span class=\"f\">--out_file<\/span> mobtyper.txt`,'Faz só a <b>tipagem<\/b> de uma sequência já conhecida como plasmídeo: Inc (rep), relaxase, MPF, oriT, mobilidade prevista e cluster. Útil para um plasmídeo fechado ou um contig isolado. O <span style=\"font-family:ui-monospace,Menlo,monospace\">mob_recon<\/span> já chama essa tipagem para cada plasmídeo que reconstrói.']];\nlet cs=1;\nfunction d3(){\n $('cb').innerHTML=CM.map((c,i)=>`<button class=\"${i===cs?'on':''}\" data-i=\"${i}\">${i+1} · ${c[0]}<\/button>`).join('');\n $('cm').innerHTML=CM[cs][1];$('ce').innerHTML=CM[cs][2]+(cs===1?'<br><br><span style=\"color:#666;font-size:12px\">Existe também o <span style=\"font-family:ui-monospace,Menlo,monospace\">mob_cluster<\/span>, usado para agrupar coleções de plasmídeos e atribuir códigos de cluster; fica fora do fluxo básico da aula.<\/span>':'');\n}\n$('cb').onclick=e=>{const b=e.target.closest('button');if(b){cs=+b.dataset.i;d3()}};\n\n/* ---------- saida real ---------- */\nconst MT=[['AA405',29,320772,'IncFIB, IncHI1B','MOBH','MPF_F','conjugative'],['AA457',8,99453,'IncFIB','MOBF','MPF_F','conjugative'],['AA275',4,72064,'IncFII, rep_cluster_2183, rep_cluster_2350','MOBF','-','mobilizable'],['AA833',1,21291,'-','-','-','non-mobilizable'],['AA944',1,9857,'ColRNAI_rep_cluster_1857','MOBC','-','mobilizable'],['AC129',1,6268,'rep_cluster_1195','MOBP','-','mobilizable'],['AA103',1,4294,'ColRNAI_rep_cluster_1987, rep_cluster_2373','-','-','non-mobilizable'],['AB040',1,2495,'rep_cluster_2335','- (oriT: MOB_unknown)','-','mobilizable'],['AB696',1,2222,'-','-','-','non-mobilizable'],['AB236',1,2185,'ColpVC','-','-','non-mobilizable'],['AB041',1,1867,'-','-','-','non-mobilizable']];\nconst GE=[['contig_14','plasmid AA405','ISKpn34','IS3','1221','99,0'],['contig_16','plasmid AA405','ISEc27','IS3','1329','93,5'],['contig_40','plasmid AA405','ISEc29','IS4','6736','99,7'],['contig_47','plasmid AA405','ISEcp1','IS1380','2656','96,6'],['contig_77','plasmid AA457','ISEcl1','IS3','1336','98,4'],['contig_42','plasmid AA275','ISKpn7','IS21','10006','99,9'],['contig_21','cromossomo','IS1400','IS3','1207','—']];\nconst OF=[['chromosome.fasta','Todos os contigs classificados como cromossomo, em um FASTA.'],['plasmid_*.fasta','Um arquivo por plasmídeo reconstruído (por exemplo, plasmid_AA103.fasta, plasmid_AA275.fasta). O nome é o cluster primário.'],['contig_report.txt','Uma linha por contig: cromossomo ou plasmídeo, cluster, tamanho, GC, marcadores e circularidade.'],['biomarkers.blast.txt','Acertos brutos de BLAST dos marcadores nos contigs: é a evidência de rep, relaxase, MPF e oriT.'],['mge.report.txt','Elementos móveis detectados nos contigs. Abaixo, um trecho real: sequências de inserção (IS) dentro de contigs de plasmídeo.'],['mobtyper_results.txt','Uma linha por plasmídeo reconstruído. Abaixo, as 11 linhas reais do exemplo.']];\nlet ofs=5;\nfunction out(){\n $('ob').innerHTML=OF.map((f,i)=>`<button class=\"${i===ofs?'on':''}\" data-i=\"${i}\" style=\"font-family:ui-monospace,Menlo,monospace;font-size:11px\">${f[0]}<\/button>`).join('');\n let h=`<div class=\"explain\" style=\"margin-top:0\">${OF[ofs][1]}<\/div>`;\n const cm=x=>x==='conjugative'?'b-g':x==='mobilizable'?'b-y':'b-gr';\n if(ofs===5)h+=`<table class=\"mt\"><tr><th>cluster<\/th><th>contigs<\/th><th>pb<\/th><th>rep (Inc)<\/th><th>relaxase<\/th><th>MPF<\/th><th>mobilidade<\/th><\/tr>`+MT.map(r=>`<tr><td><b>${r[0]}<\/b><\/td><td>${r[1]}<\/td><td>${r[2].toLocaleString('pt-BR')}<\/td><td>${r[3]}<\/td><td>${r[4]}<\/td><td>${r[5]}<\/td><td><span class=\"badge ${cm(r[6])}\">${r[6]}<\/span><\/td><\/tr>`).join('')+`<\/table>`;\n if(ofs===4)h+=`<table class=\"mt\"><tr><th>contig<\/th><th>molécula<\/th><th>IS<\/th><th>família<\/th><th>comprimento<\/th><th>% identidade<\/th><\/tr>`+GE.map(r=>`<tr><td>${r[0]}<\/td><td>${r[1]}<\/td><td><b>${r[2]}<\/b><\/td><td>${r[3]}<\/td><td>${r[4]}<\/td><td>${r[5]}<\/td><\/tr>`).join('')+`<\/table>`;\n $('op').innerHTML=h;\n}\n$('ob').onclick=e=>{const b=e.target.closest('button');if(b){ofs=+b.dataset.i;out()}};\nd0();d1();d3();tab(0);out();\n<\/script><\/body><\/html>\n"}, {"t": "Referências", "h": "<!doctype html>\n<html lang=\"pt-BR\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Referências<\/title>\n<style>\n:root{--g:#037972;--y:#f8e04d;--gr:#ebebeb;--tx:#222}\n*{box-sizing:border-box}\nbody{margin:0;background:#fff;color:var(--tx);font-family:\"Verdana Pro\",Verdana,\"DejaVu Sans\",sans-serif;font-size:14px}\n.wrap{max-width:1000px;margin:0 auto;padding:24px 20px 40px}\n.eyebrow{font:11px ui-monospace,Menlo,monospace;letter-spacing:.12em;color:#555;text-transform:uppercase}\nh1{margin:6px 0 6px;font-size:26px;color:var(--g)}\np.lead{margin:0 0 14px;color:#444;line-height:1.5}\nul{list-style:none;margin:0;padding:0}\nli{padding:10px 0;border-bottom:1px solid var(--gr);line-height:1.6;text-align:left}\nli a{color:var(--g);overflow-wrap:anywhere}\n.us{font-size:11.5px;color:#666;margin-top:2px}\n.pm{border:1.5px solid var(--y);background:#fffbe0;border-radius:10px;padding:10px 12px;line-height:1.55;margin-top:16px}\n.pm b{color:#7a6600}\n<\/style><\/head><body><div class=\"wrap\">\n<div class=\"eyebrow\">Referências<\/div>\n<h1>Referências<\/h1>\n<p class=\"lead\">Formato ABNT (NBR 6023), em ordem alfabética.<\/p>\n<ul><li>ADEY, A. et al. Rapid, low-input, low-bias construction of shotgun fragment libraries by high-density in vitro transposition. <b>Genome Biology<\/b>, London, v. 11, n. 12, p. R119, 2010. DOI: <a href=\"https://doi.org/10.1186/gb-2010-11-12-r119\" target=\"_blank\" rel=\"noopener\">10.1186/gb-2010-11-12-r119<\/a>.<div class=\"us\">Usada em: Do DNA às reads<\/div><\/li><li>BANKEVICH, A. et al. SPAdes: a new genome assembly algorithm and its applications to single-cell sequencing. <b>Journal of Computational Biology<\/b>, New Rochelle, v. 19, n. 5, p. 455-477, 2012. DOI: <a href=\"https://doi.org/10.1089/cmb.2012.0021\" target=\"_blank\" rel=\"noopener\">10.1089/cmb.2012.0021<\/a>.<div class=\"us\">Usada em: FASTA e headers; k-mers e grafo<\/div><\/li><li>BENTLEY, D. R. et al. Accurate whole human genome sequencing using reversible terminator chemistry. <b>Nature<\/b>, London, v. 456, n. 7218, p. 53-59, 2008. DOI: <a href=\"https://doi.org/10.1038/nature07517\" target=\"_blank\" rel=\"noopener\">10.1038/nature07517<\/a>.<div class=\"us\">Usada em: Do DNA às reads<\/div><\/li><li>CARATTOLI, A. et al. In silico detection and typing of plasmids using PlasmidFinder and plasmid multilocus sequence typing. <b>Antimicrobial Agents and Chemotherapy<\/b>, Washington, v. 58, n. 7, p. 3895-3903, 2014. DOI: <a href=\"https://doi.org/10.1128/AAC.02412-14\" target=\"_blank\" rel=\"noopener\">10.1128/AAC.02412-14<\/a>.<div class=\"us\">Usada em: MOB-suite; Plasmídeos<\/div><\/li><li>CHEN, S. et al. fastp: an ultra-fast all-in-one FASTQ preprocessor. <b>Bioinformatics<\/b>, Oxford, v. 34, n. 17, p. i884-i890, 2018. DOI: <a href=\"https://doi.org/10.1093/bioinformatics/bty560\" target=\"_blank\" rel=\"noopener\">10.1093/bioinformatics/bty560<\/a>.<div class=\"us\">Usada em: fastp<\/div><\/li><li>CHKLOVSKI, A. et al. CheckM2: a rapid, scalable and accurate tool for assessing microbial genome quality using machine learning. <b>Nature Methods<\/b>, New York, v. 20, n. 8, p. 1203-1212, 2023. DOI: <a href=\"https://doi.org/10.1038/s41592-023-01940-w\" target=\"_blank\" rel=\"noopener\">10.1038/s41592-023-01940-w<\/a>.<div class=\"us\">Usada em: N50; Completude<\/div><\/li><li>FASTP: manual (man page), versão 0.23.0. Debian 12, [s. d.]. Disponível em: <a href=\"https://dokk.org/manpages/debian/12/fastp/fastp.1.en\" target=\"_blank\" rel=\"noopener\">https://dokk.org/manpages/debian/12/fastp/fastp.1.en<\/a>. Acesso em: 3 nov. 2026.<div class=\"us\">Usada em: fastp (valores padrão das flags)<\/div><\/li><li>GOODWIN, S.; MCPHERSON, J. D.; MCCOMBIE, W. R. Coming of age: ten years of next-generation sequencing technologies. <b>Nature Reviews Genetics<\/b>, London, v. 17, n. 6, p. 333-351, 2016. DOI: <a href=\"https://doi.org/10.1038/nrg.2016.49\" target=\"_blank\" rel=\"noopener\">10.1038/nrg.2016.49<\/a>.<div class=\"us\">Usada em: Do DNA às reads<\/div><\/li><li>GUREVICH, A. et al. QUAST: quality assessment tool for genome assemblies. <b>Bioinformatics<\/b>, Oxford, v. 29, n. 8, p. 1072-1075, 2013. DOI: <a href=\"https://doi.org/10.1093/bioinformatics/btt086\" target=\"_blank\" rel=\"noopener\">10.1093/bioinformatics/btt086<\/a>.<div class=\"us\">Usada em: N50<\/div><\/li><li>LUSA, R. <b>Aula de montagem de genomas bacterianos<\/b>: minicurso EPB. [S. l.]: GitHub, [2026]. Disponível em: <a href=\"https://github.com/Rodrigo-Lusa/minicurso_EPB\" target=\"_blank\" rel=\"noopener\">https://github.com/Rodrigo-Lusa/minicurso_EPB<\/a>. Acesso em: 3 nov. 2026.<div class=\"us\">Usada em: fastp<\/div><\/li><li>MANNI, M. et al. BUSCO update: novel and streamlined workflows along with broader and deeper phylogenetic coverage for scoring of eukaryotic, prokaryotic, and viral genomes. <b>Molecular Biology and Evolution<\/b>, Oxford, v. 38, n. 10, p. 4647-4654, 2021. DOI: <a href=\"https://doi.org/10.1093/molbev/msab199\" target=\"_blank\" rel=\"noopener\">10.1093/molbev/msab199<\/a>.<div class=\"us\">Usada em: N50; Completude<\/div><\/li><li>PARKS, D. H. et al. CheckM: assessing the quality of microbial genomes recovered from isolates, single cells, and metagenomes. <b>Genome Research<\/b>, Cold Spring Harbor, v. 25, n. 7, p. 1043-1055, 2015. DOI: <a href=\"https://doi.org/10.1101/gr.186072.114\" target=\"_blank\" rel=\"noopener\">10.1101/gr.186072.114<\/a>.<div class=\"us\">Usada em: Completude<\/div><\/li><li>ROBERTSON, J.; NASH, J. H. E. MOB-suite: software tools for clustering, reconstruction and typing of plasmids from draft assemblies. <b>Microbial Genomics<\/b>, London, v. 4, n. 8, p. e000206, 2018. DOI: <a href=\"https://doi.org/10.1099/mgen.0.000206\" target=\"_blank\" rel=\"noopener\">10.1099/mgen.0.000206<\/a>.<div class=\"us\">Usada em: MOB-suite; Plasmídeos<\/div><\/li><li>ROBERTSON, J. et al. Universal whole-sequence-based plasmid typing and its utility to prediction of host range and epidemiological surveillance. <b>Microbial Genomics<\/b>, London, v. 6, n. 10, p. e000435, 2020. DOI: <a href=\"https://doi.org/10.1099/mgen.0.000435\" target=\"_blank\" rel=\"noopener\">10.1099/mgen.0.000435<\/a>.<div class=\"us\">Usada em: MOB-suite; Plasmídeos<\/div><\/li><li>SMILLIE, C. et al. Mobility of plasmids. <b>Microbiology and Molecular Biology Reviews<\/b>, Washington, v. 74, n. 3, p. 434-452, 2010. DOI: <a href=\"https://doi.org/10.1128/MMBR.00020-10\" target=\"_blank\" rel=\"noopener\">10.1128/MMBR.00020-10<\/a>.<div class=\"us\">Usada em: MOB-suite; Plasmídeos<\/div><\/li><\/ul>\n<\/div><\/body><\/html>"}];let cur=0;
const nv=document.getElementById('nv'),mn=document.getElementById('mn');
M.forEach((m,i)=>{const b=document.createElement('button');b.innerHTML='<i>'+(i+1)+'</i>'+m.t;b.onclick=()=>go(i);nv.appendChild(b);
 const f=document.createElement('iframe');f.title=m.t;mn.appendChild(f)});
function go(i){cur=i;const fr=mn.children;
 for(let k=0;k<M.length;k++){fr[k].classList.toggle('on',k===i);nv.children[k].classList.toggle('on',k===i)}
 if(!fr[i].dataset.l){fr[i].srcdoc=M[i].h;fr[i].dataset.l=1}
 nv.children[i].scrollIntoView({inline:'center',block:'nearest'});
 document.getElementById('pv').disabled=i===0;document.getElementById('nx').disabled=i===M.length-1;
 document.getElementById('ps').textContent=(i+1)+' / '+M.length+' · '+M[i].t;
 try{history.replaceState(null,'','#'+(i+1))}catch(e){}}
document.getElementById('pv').onclick=()=>go(Math.max(0,cur-1));
document.getElementById('nx').onclick=()=>go(Math.min(M.length-1,cur+1));
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight'&&e.altKey)go(Math.min(M.length-1,cur+1));if(e.key==='ArrowLeft'&&e.altKey)go(Math.max(0,cur-1))});
const h=parseInt((location.hash||'').slice(1));go(h>=1&&h<=M.length?h-1:0);
